<!-- title -->
<title>出版人生模擬器</title>

<style>
:root{
  --bg:#f4ecd8;
  --panel:#fffbf1;
  --panel2:#f6ead2;
  --ink:#22374a;
  --chalk:#22374a;
  --dim:#66798c;
  --rule:#22374a;
  --red:#e8964a;
  --gold:#f0b429;
  --good:#3f8f5f;
  --bad:#c94f4f;
  --font-display: "PingFang TC","Hiragino Sans CNS","Noto Sans TC","Microsoft JhengHei",system-ui,-apple-system,sans-serif;
  --font-body: "PingFang TC","Hiragino Sans CNS","Noto Sans TC","Microsoft JhengHei",system-ui,-apple-system,sans-serif;
  --font-mono: "PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--chalk);
  font-family:var(--font-body);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
.icon{ display:inline-block; vertical-align:middle; fill:currentColor; flex-shrink:0; }
@keyframes floatIcon{ 0%,100%{ transform:translateY(0) rotate(-2deg); } 50%{ transform:translateY(-3px) rotate(2deg); } }
.logo-icon{ width:26px; height:auto; color:var(--gold); margin-right:6px; animation:floatIcon 3.2s ease-in-out infinite; }
.pathcard .picon-wrap{
  width:44px; height:44px; border-radius:12px; background:var(--accent-tint, #fdf1de);
  display:flex; align-items:center; justify-content:center; margin-bottom:10px;
  border:2px solid var(--accent, var(--ink));
  transition:transform .25s cubic-bezier(.34,1.56,.64,1);
}
.pathcard .picon{ width:24px; height:auto; color:var(--accent, var(--ink)); transition:transform .25s ease; }
.pathcard:hover .picon-wrap{ transform:scale(1.08) rotate(-4deg); }
.pathcard:hover .picon{ transform:scale(1.08); }
.ledger .cell .icon{ width:15px; height:auto; color:var(--accent, var(--gold)); margin-bottom:1px; }
.ledger .k{ display:flex; align-items:center; gap:4px; }
.ending-icon-wrap{ display:flex; justify-content:center; margin-bottom:10px; }
@keyframes trophyPop{ 0%{ transform:scale(0) rotate(-15deg); opacity:0; } 60%{ transform:scale(1.15) rotate(6deg); opacity:1; } 100%{ transform:scale(1) rotate(0); } }
.ending-icon{ width:60px; height:auto; color:var(--gold); animation:trophyPop .5s cubic-bezier(.34,1.56,.64,1); }
@media (prefers-reduced-motion: reduce){ .logo-icon, .ending-icon{ animation:none; } }
button{ font:inherit; }
.wrap{ max-width:720px; margin:0 auto; padding:0 16px 40px; }

/* ---- masthead: title-bar card, dark-fill like a header ribbon ---- */
.masthead{
  display:flex; align-items:center; justify-content:space-between;
  margin:18px 0 14px; flex-wrap:wrap; gap:8px;
  background:var(--ink); border:2px solid var(--ink); border-radius:20px;
  padding:16px 20px; box-shadow:0 6px 0 rgba(34,55,74,.08), 0 10px 22px rgba(34,55,74,.16);
}
.masthead h1{
  font-family:var(--font-display); font-weight:700; font-size:1.3rem;
  letter-spacing:.02em; margin:0; text-wrap:balance; color:#fff;
  display:flex; align-items:center;
}
.masthead .kicker{
  font-size:.64rem; letter-spacing:.12em;
  text-transform:uppercase; color:var(--gold); font-weight:600;
}

/* ---- pill / tag badge, shared by stage-pill / careertags / gamble-tag / delta ---- */
.pill-tag{
  display:inline-block; border:1.5px solid var(--ink); color:var(--ink); background:var(--panel);
  padding:3px 12px; border-radius:999px; font-size:.68rem; letter-spacing:.04em; font-weight:600;
}

/* ---- app shell: sticky header, scrolling log, sticky footer ---- */
.shell{ display:flex; flex-direction:column; }
.hdr{
  position:sticky; top:0; z-index:5;
  background:var(--panel);
  border:2.5px solid var(--ink); border-bottom:1.5px dashed var(--rule);
  border-radius:20px 20px 0 0;
  box-shadow:0 4px 0 rgba(34,55,74,.05), 0 8px 18px rgba(34,55,74,.08);
  padding:16px 18px 12px;
}
.topline{
  display:flex; justify-content:space-between; align-items:baseline; flex-wrap:wrap; gap:6px;
  font-size:.7rem; color:var(--dim); letter-spacing:.02em; margin-bottom:10px; font-weight:600;
}
.stage-pill{
  display:inline-block; border:1.5px solid var(--ink); color:var(--ink); background:var(--gold); padding:3px 12px;
  border-radius:999px; font-size:.66rem; letter-spacing:.06em; font-weight:700;
}
.lamps{ display:flex; gap:6px; margin-bottom:10px; }
.lamp{
  flex:1; text-align:center; font-size:.62rem; letter-spacing:.04em; font-weight:600;
  color:var(--dim); padding:6px 4px; border:1.5px solid var(--rule); border-radius:10px; background:var(--panel2);
}
.lamp.done{ color:var(--ink); background:var(--gold); border-color:var(--ink); }
@keyframes pillPulse{ 0%,100%{ box-shadow:0 0 0 rgba(240,180,41,.5); } 50%{ box-shadow:0 0 9px rgba(240,180,41,.7); } }
.lamp.now{ color:#fff; border-color:var(--ink); background:var(--ink); animation:pillPulse 1.6s ease-in-out infinite; }
@media (prefers-reduced-motion: reduce){ .lamp.now{ animation:none; } }

.ledger{
  display:grid; grid-template-columns:repeat(auto-fit,minmax(84px,1fr));
  gap:10px 12px;
}
.ledger .cell{
  display:flex; flex-direction:column; gap:4px; background:var(--panel2);
  border:1.5px solid var(--rule); border-radius:10px; padding:7px 9px;
}
.ledger .k{ font-size:.6rem; letter-spacing:.03em; color:var(--dim); font-weight:600; white-space:nowrap;}
.ledger .v{ font-size:.9rem; font-variant-numeric:tabular-nums; font-weight:700; color:var(--chalk);}
.ledger .bar{ height:5px; background:var(--rule); opacity:.25; border-radius:3px; overflow:hidden; }
.ledger .bar i{ display:block; height:100%; background:var(--accent, var(--gold)); border-radius:3px; transition:width .3s cubic-bezier(.34,1.56,.64,1); }
.ledger .money.neg .v{ color:var(--bad); }

.log{
  background:var(--bg);
  border-left:2.5px solid var(--ink); border-right:2.5px solid var(--ink);
  padding:12px 16px; display:flex; flex-direction:column; gap:10px;
}
.entry{
  border:1.5px solid var(--rule); border-radius:14px; padding:12px 14px; background:var(--panel);
}
.entry.pending{ border-color:var(--gold); border-style:dashed; background:var(--panel2); }
.entry.trait{ border-color:var(--ink); background:#fdf0cf; }
.entry.trait .etitle{ color:var(--ink); display:flex; align-items:center; gap:6px; }
.entry.trait .trait-icon{ width:18px; height:auto; color:var(--ink); }
.entry.trait p{ font-size:.86rem; color:var(--dim); }
.entry.breakthrough{ border-color:var(--good); border-width:2px; background:rgba(63,143,95,.08); }
.entry.breakthrough .etitle{ color:var(--good); display:flex; align-items:center; gap:6px; }
.entry.breakthrough .breakthrough-icon{ width:18px; height:auto; color:var(--good); }
.entry.breakthrough p{ font-size:.86rem; color:var(--dim); }
.entry.slump{ border-color:var(--bad); border-width:2px; background:rgba(201,79,79,.08); }
.entry.slump .etitle{ color:var(--bad); display:flex; align-items:center; gap:6px; }
.entry.slump .slump-icon{ width:18px; height:auto; color:var(--bad); }
.entry.slump p{ font-size:.86rem; color:var(--dim); }
.entry.debt-warn{ border-color:var(--bad); border-width:2px; background:rgba(201,79,79,.08); }
.entry.debt-warn .etitle{ color:var(--bad); display:flex; align-items:center; gap:6px; }
.entry.debt-warn .debt-icon{ width:18px; height:auto; color:var(--bad); }
.entry.debt-warn p{ font-size:.86rem; color:var(--dim); }
.entry.debt-relief{ border-color:var(--good); border-width:2px; background:rgba(63,143,95,.08); }
.entry.debt-relief .etitle{ color:var(--good); display:flex; align-items:center; gap:6px; }
.entry.debt-relief .relief-icon{ width:18px; height:auto; color:var(--good); }
.entry.debt-relief p{ font-size:.86rem; color:var(--dim); }
.traitlist{ display:flex; flex-direction:column; gap:8px; margin:4px 0 20px; }
.traitlist .tcard{ border:1.5px solid var(--ink); border-radius:12px; padding:10px 12px; background:#fdf0cf; }
.traitlist .tname{ font-family:var(--font-display); font-size:.92rem; color:var(--ink); display:flex; align-items:center; gap:6px; margin-bottom:2px; font-weight:700; }
.traitlist .tname .icon{ width:15px; height:auto; }
.traitlist .tdesc{ font-size:.78rem; color:var(--dim); line-height:1.5; }
.entry .etitle{ font-family:var(--font-display); font-size:1.02rem; margin:0 0 4px; color:var(--chalk); text-wrap:balance; font-weight:700;}
.entry .esub{ font-size:.62rem; color:var(--dim); letter-spacing:.04em; font-weight:600; margin-bottom:6px;}
.entry p{ margin:0 0 8px; line-height:1.7; font-size:.95rem; color:var(--chalk); }
.entry .picked{ font-size:.86rem; color:var(--dim); border-left:2.5px solid var(--gold); padding-left:10px; margin:8px 0 8px;}
.gamble-tag{
  display:inline-block; margin-left:8px; font-size:.66rem; font-weight:700;
  letter-spacing:.02em; padding:2px 10px; border-radius:999px; vertical-align:middle;
  animation:chipPop .3s cubic-bezier(.34,1.56,.64,1);
}
.gamble-tag.win{ color:var(--good); border:1.5px solid var(--good); background:rgba(63,143,95,.14); }
.gamble-tag.lose{ color:var(--bad); border:1.5px solid var(--bad); background:rgba(201,79,79,.14); }
.result-text{ display:flex; gap:8px; align-items:flex-start; margin:2px 0 10px; }
.result-text .vdot{ display:inline-block; width:7px; height:7px; border-radius:50%; margin-top:8px; flex-shrink:0; }
.result-text .vdot.up{ background:var(--good); }
.result-text .vdot.down{ background:var(--bad); }
.result-text .vdot.flat{ background:var(--dim); }
.result-text span.rtxt{ font-size:.92rem; line-height:1.65; color:var(--chalk); }
.delta{ display:flex; flex-wrap:wrap; gap:6px 8px; margin-top:2px; }
.delta span{
  font-size:.76rem; font-weight:700;
  padding:3px 10px; border-radius:999px; letter-spacing:.01em;
  animation:chipPop .32s cubic-bezier(.34,1.56,.64,1) backwards;
}
.delta span:nth-child(2){ animation-delay:.05s; }
.delta span:nth-child(3){ animation-delay:.1s; }
.delta span:nth-child(4){ animation-delay:.15s; }
@keyframes chipPop{ from{ transform:scale(.4); opacity:0; } to{ transform:scale(1); opacity:1; } }
@media (prefers-reduced-motion: reduce){ .gamble-tag, .delta span{ animation:none; } }
.delta span.pos{ color:var(--good); background:rgba(63,143,95,0.14); border:1.5px solid rgba(63,143,95,0.4); }
.delta span.neg{ color:var(--bad); background:rgba(201,79,79,0.14); border:1.5px solid rgba(201,79,79,0.4); }
@keyframes entrypop{ from{ transform:scale(.985); opacity:.4; } to{ transform:scale(1); opacity:1; } }
.entry.fresh{ animation:entrypop .28s ease-out; }
@media (prefers-reduced-motion: reduce){ .entry.fresh{ animation:none; } }
.ticker{
  font-size:.72rem; color:var(--dim); font-weight:600;
  border:1.5px dashed var(--rule); border-radius:10px; background:var(--panel);
  padding:8px 12px; display:flex; gap:8px;
}
.ticker b{ color:var(--ink); font-weight:700; }
.stagebreak{
  text-align:center; font-size:.7rem; letter-spacing:.06em; font-weight:700;
  color:var(--ink); padding:10px 0; border-top:1.5px dashed var(--rule); border-bottom:1.5px dashed var(--rule);
}
.entry.stage-summary{ border-color:var(--gold); border-width:2px; background:var(--panel2); }
.entry.stage-summary .etitle{ color:var(--gold); }
.stage-sales-highlight{ margin:8px 0 0; font-size:.85rem; color:var(--gold); font-weight:700; }
.stage-narrative, .year-narrative{ font-size:.85rem; line-height:1.65; color:var(--chalk); margin:2px 0 8px; }
.entry.year-summary{ border-style:dashed; background:var(--panel); }
.entry.year-summary .etitle{ color:var(--accent, var(--ink)); font-size:.82rem; }

.ftr{
  position:sticky; bottom:0; z-index:5;
  background:var(--panel); border:2.5px solid var(--ink); border-top:1.5px dashed var(--rule);
  border-radius:0 0 20px 20px; box-shadow:0 -4px 0 rgba(34,55,74,.04), 0 -8px 18px rgba(34,55,74,.06); padding:16px 18px;
}
.ftr .hint{ font-size:.7rem; color:var(--dim); margin:0 0 10px; letter-spacing:.02em; font-weight:600;}
/* "decision needed" treatment on the two phases the player must actively act on */
.ftr-alloc, .ftr-event{
  background:#fdf1de; border-color:var(--gold);
  position:relative;
}
.ftr-alloc::before, .ftr-event::before{
  content:"本回合待決定"; display:inline-block; position:absolute; top:-13px; left:16px;
  background:var(--gold); color:var(--ink); font-size:.62rem; font-weight:700; letter-spacing:.04em;
  padding:3px 12px; border-radius:999px; border:1.5px solid var(--ink);
}

/* choices */
.choices{ display:flex; flex-direction:column; gap:8px; }
button.choice{
  text-align:left; font-family:var(--font-body); font-size:.92rem;
  background:var(--panel); border:1.5px solid var(--ink); color:var(--chalk);
  padding:11px 16px; cursor:pointer; line-height:1.5; border-radius:14px;
  transition:transform .12s cubic-bezier(.34,1.56,.64,1), background .15s ease, border-color .15s ease, box-shadow .15s ease;
}
button.choice:hover{ background:var(--gold); color:var(--ink); border-color:var(--ink); transform:translateX(3px); box-shadow:0 3px 10px rgba(34,55,74,.18); }
button.choice:active{ transform:scale(.98); }
button.choice:focus-visible{ outline:2px solid var(--gold); outline-offset:2px; }
button.choice .odds{
  display:block; font-size:.66rem; letter-spacing:.02em; font-weight:600;
  color:var(--dim); margin-top:4px; opacity:.9;
}
button.choice:hover .odds{ color:var(--ink); }
button.choice .risk{
  display:block; font-size:.64rem; letter-spacing:.02em; font-weight:600;
  color:var(--bad); margin-top:2px; opacity:.85;
}
button.choice:hover .risk{ color:var(--bad); opacity:1; }
button.primary{
  font-size:.78rem; letter-spacing:.04em; font-weight:700;
  background:var(--gold); color:var(--ink); border:2px solid var(--ink); border-radius:999px;
  padding:11px 22px; cursor:pointer;
  transition:transform .15s cubic-bezier(.34,1.56,.64,1), background .15s ease, box-shadow .15s ease;
}
button.primary:hover{ background:var(--ink); border-color:var(--ink); color:#fff; transform:scale(1.03); box-shadow:0 4px 12px rgba(34,55,74,.3);}
button.primary:active{ transform:scale(.97); }
button.primary:focus-visible{ outline:2px solid var(--ink); outline-offset:2px;}
button.ghost{
  font-size:.74rem; letter-spacing:.02em; font-weight:600;
  background:var(--panel); border:1.5px solid var(--rule); color:var(--dim); border-radius:999px;
  padding:9px 16px; cursor:pointer; transition:border-color .15s ease, color .15s ease, transform .12s ease;
}
button.ghost:hover{ border-color:var(--ink); color:var(--ink); transform:translateY(-1px); }
.actions{ display:flex; gap:10px; flex-wrap:wrap; justify-content:center; margin-top:4px; }

/* start screen */
.startpage{
  background:var(--panel); border:2.5px solid var(--ink); border-radius:20px; padding:26px 22px; margin-top:6px;
  box-shadow:0 6px 0 rgba(34,55,74,.06), 0 10px 22px rgba(34,55,74,.1);
}
h2.title{ font-family:var(--font-display); font-size:1.2rem; margin:0 0 4px; color:var(--chalk); text-wrap:balance; font-weight:700; text-align:center;}
.sub{ font-size:.68rem; color:var(--dim); letter-spacing:.06em; font-weight:700; text-transform:uppercase; margin-bottom:14px; text-align:center;}
p{ line-height:1.75; margin:0 0 14px; font-size:1rem; }
label.field{ display:block; margin-bottom:14px; text-align:center; }
label.field .lbl{ font-size:.68rem; letter-spacing:.04em; font-weight:700; color:var(--dim); display:block; margin-bottom:6px;}
input[type=text]{
  width:100%; font-family:var(--font-body); font-size:1rem; padding:10px 14px;
  background:var(--panel2); border:1.5px solid var(--rule); color:var(--chalk); border-radius:10px;
}
input[type=text]:focus-visible{ outline:2px solid var(--gold); outline-offset:1px; }

.paths{ display:flex; flex-wrap:wrap; justify-content:center; gap:10px; margin:14px 0; }
.pathcard{
  flex:0 1 calc((100% - 20px)/3); min-width:140px;
  border:2px solid var(--rule); border-radius:16px; padding:14px; cursor:pointer; background:var(--panel);
  transition:border-color .18s, background .18s, transform .2s cubic-bezier(.34,1.56,.64,1), box-shadow .2s ease;
  box-shadow:0 3px 0 rgba(34,55,74,.05), 0 4px 10px rgba(34,55,74,.06);
}
.pathcard:hover{ border-color:var(--accent, var(--ink)); transform:translateY(-3px); box-shadow:0 5px 0 rgba(34,55,74,.08), 0 10px 18px rgba(34,55,74,.12); }
.pathcard:focus-visible{ outline:2px solid var(--gold); outline-offset:2px; border-color:var(--accent, var(--ink)); }
@media (max-width:480px){
  .pathcard{ flex:1 1 100%; }
}
.pathcard.sel{ border-color:var(--accent, var(--ink)); background:var(--accent-tint, #fdf1de); transform:translateY(-2px); }
.pathcard h3{ font-family:var(--font-display); margin:0 0 4px; font-size:1rem; color:var(--chalk); font-weight:700;}
.pathcard p{ margin:0; font-size:.78rem; color:var(--dim); line-height:1.5; }
.pathcard .stats{ font-size:.64rem; color:var(--accent, var(--ink)); margin-top:8px; letter-spacing:.02em; font-weight:600;}

.radiorow{ display:flex; gap:8px; flex-wrap:wrap; }
.radiorow label{
  font-size:.7rem; font-weight:600; border:1.5px solid var(--rule); border-radius:999px;
  padding:7px 14px; cursor:pointer; color:var(--dim);
}
.radiorow input{ display:none; }
.radiorow label:has(input:checked){ border-color:var(--ink); color:var(--ink); background:var(--gold); }

/* allocator (lives in footer) */
.alloc-row{ display:flex; align-items:center; gap:10px; padding:6px 0; }
.alloc-name{ width:78px; font-size:.74rem; font-weight:600; color:var(--dim); flex-shrink:0;}
.alloc-cap-tag{ font-size:.62rem; font-weight:600; color:var(--gold); background:rgba(240,180,41,.15); border:1px solid var(--gold); border-radius:999px; padding:1px 5px; white-space:nowrap; }
.alloc-bar{ flex:1; height:8px; background:var(--rule); opacity:.9; border-radius:4px; overflow:hidden; background-color:var(--panel2); border:1px solid var(--rule); }
.alloc-bar i{ display:block; height:100%; background:var(--gold); }
.alloc-btns{ display:flex; gap:4px; }
.alloc-btns button{
  width:26px; height:26px; border:1.5px solid var(--ink); background:var(--panel); color:var(--chalk);
  border-radius:8px; cursor:pointer; font-size:.85rem; line-height:1; font-weight:700;
}
.alloc-btns button:disabled{ opacity:.3; cursor:not-allowed; }
.pool{ font-size:.76rem; font-weight:700; color:var(--ink); text-align:right; margin:0 0 8px; letter-spacing:.02em;}

/* ending */
.ending-tag{
  display:inline-block; font-size:.66rem; letter-spacing:.06em; font-weight:700;
  padding:4px 12px; border:1.5px solid; margin-bottom:10px; border-radius:999px;
}
.ending-tag.great{ color:var(--ink); border-color:var(--ink); background:var(--gold); }
.ending-tag.good{ color:var(--good); border-color:var(--good); }
.ending-tag.neutral{ color:var(--dim); border-color:var(--rule); }
.ending-tag.bad{ color:var(--bad); border-color:var(--bad); }
.history{ font-size:.7rem; color:var(--dim); line-height:1.9; }
.careertags{ display:flex; flex-wrap:wrap; gap:8px; margin:4px 0 20px; }
.careertags span{
  font-size:.72rem; letter-spacing:.02em; font-weight:700;
  background:var(--panel); border:1.5px solid var(--ink); color:var(--ink);
  padding:5px 13px; border-radius:999px;
}
.career-recent{ display:flex; flex-wrap:wrap; gap:6px; }
.career-chip{
  font-size:.68rem; font-weight:600; color:var(--dim);
  background:var(--panel2); border:1px solid var(--rule);
  padding:3px 10px; border-radius:999px;
}
.footer-note{ text-align:center; font-size:.66rem; color:var(--dim); margin-top:20px; letter-spacing:.02em; font-weight:600;}
</style>

var EVENTS_BY_ID = {};
EVENTS.forEach(function(ev){ EVENTS_BY_ID[ev.id]=ev; });
function getPendingEvent(){ return EVENTS_BY_ID[S.pendingEventId]; }
/* 年度/階段回顧要挑「這段時間發生了什麼」，非 repeat 的一次性事件比例行的 repeat 事件更值得被記住 */
var EVENT_ONCE_BY_TITLE = {};
EVENTS.forEach(function(ev){ EVENT_ONCE_BY_TITLE[ev.title] = !!ev.once; });

/* ---------- game state ---------- */
var S = null;
var seedInput = "";
var startPath = null;
var SAVE_KEY = "pls_save_v1";

function saveProgress(){
  try{ localStorage.setItem(SAVE_KEY, JSON.stringify(S)); }catch(e){}
}
function loadProgress(){
  try{
    var raw = localStorage.getItem(SAVE_KEY);
    if(!raw) return null;
    return JSON.parse(raw);
  }catch(e){ return null; }
}
function clearProgress(){
  try{ localStorage.removeItem(SAVE_KEY); }catch(e){}
}

/* ---------- 生涯紀錄：跨局的完局歷史，純記錄不影響任何機制或機率，保持「同種子＋同選擇＝同人生」不變 ---------- */
var CAREER_LOG_KEY = "pls_career_log_v1";
var CAREER_LOG_MAX = 50;
function loadCareerLog(){
  try{
    var raw = localStorage.getItem(CAREER_LOG_KEY);
    if(!raw) return [];
    var arr = JSON.parse(raw);
    return Array.isArray(arr) ? arr : [];
  }catch(e){ return []; }
}
function recordCareerLog(){
  try{
    var log = loadCareerLog();
    log.push({
      path:S.path, name:S.name, age:S.age, seed:S.seed,
      title:S.ending.title, tag:S.ending.tag
    });
    if(log.length>CAREER_LOG_MAX) log = log.slice(log.length-CAREER_LOG_MAX);
    localStorage.setItem(CAREER_LOG_KEY, JSON.stringify(log));
  }catch(e){}
}
function resumeProgress(){
  var saved = loadProgress();
  if(!saved) return;
  S = saved;
  if(!S.breakthroughTier) S.breakthroughTier = {a:0,b:0,c:0,d:0,e:0};
  if(!S.breakthroughPeak) S.breakthroughPeak = {a:S.breakthroughTier.a,b:S.breakthroughTier.b,c:S.breakthroughTier.c,d:S.breakthroughTier.d,e:S.breakthroughTier.e};
  if(!S.eventLastAge) S.eventLastAge = {};
  if(S.lastTicker===undefined) S.lastTicker = null;
  if(S.debtTier===undefined) S.debtTier = 0;
  var calls = S.rngCalls||0;
  setSeed(S.seed);
  S.rngCalls = 0;
  for(var i=0;i<calls;i++) rng(); // 快轉 rng 到存檔當下的狀態，維持「同種子＋同選擇＝同人生」在重整頁面後依然成立
  render();
}

function newGame(name, pathKey, background){
  var base = PATHS[pathKey].start;
  var bg = BACKGROUNDS[background] || BACKGROUNDS.normal;
  S = {
    name:name||"無名氏",
    path:pathKey,
    background:background,
    stats:{a:base.a, b:base.b, c:base.c, d:base.d, e:clamp(base.e+bg.e,0,100)},
    money: base.money + bg.money,
    fame: base.fame,
    stageIdx:0,
    turnInStage:0,
    age: STAGES[0].ageStart,
    seed: seedInput || makeSeed(),
    entries:[],
    log:[],
    flags:{},
    usedEvents:{},
    eventSeenCount:{},
    eventLastAge:{},
    eventsThisYear:0,
    phase:"alloc",
    pendingEventId:null,
    forcedEnding:null,
    lowGritStreak:0,
    styleCount:{bold:0, safe:0},
    traits:{},
    gambleWinStreak:0,
    allocFocusKey:null,
    allocFocusStreak:0,
    hadNegativeMoneyEarly:false,
    rngCalls:0,
    company:null,
    pendingChoiceOrder:null,
    salesTally:0,
    stageStartSnapshot:null,
    yearStartSnapshot:null,
    breakthroughTier:{a:0,b:0,c:0,d:0,e:0},
    breakthroughPeak:{a:0,b:0,c:0,d:0,e:0},
    lastTicker:null,
    debtTier:0
  };
  setSeed(S.seed);
  if(pathKey==="editor" || pathKey==="marketing"){ S.company = pick(COMPANIES); }
  snapshotStage();
  startYear();
}
function snapshotStage(){
  S.stageStartSnapshot = {
    stats:{a:S.stats.a,b:S.stats.b,c:S.stats.c,d:S.stats.d,e:S.stats.e},
    money:S.money, fame:S.fame, sales:S.salesTally, age:S.age
  };
}
function snapshotYear(){
  S.yearStartSnapshot = {
    stats:{a:S.stats.a,b:S.stats.b,c:S.stats.c,d:S.stats.d,e:S.stats.e},
    money:S.money, fame:S.fame, sales:S.salesTally
  };
}

/* 從這段期間的生涯記事裡，挑出 1-2 個「真的發生過的事」（賭贏/賭輸、大起大落、非例行的一次性事件優先），
   讓回顧讀起來像「這段時間經歷了什麼」，不是只有數字翻譯。挑不出來才退回純數值敘述。 */
function notableEventLines(logSlice){
  var scored = (logSlice||[]).map(function(l){
    var score = 0;
    if(l.won===true) score += 3;
    else if(l.won===false) score += 2;
    if(l.tier==="up2"||l.tier==="down2") score += 2;
    else if(l.tier==="up1"||l.tier==="down1") score += 1;
    if(EVENT_ONCE_BY_TITLE[l.title]) score += 1;
    return {l:l, score:score};
  }).filter(function(o){ return o.score>=2; }).sort(function(a,b){ return b.score-a.score; });
  var lines = [], usedTitles = {};
  for(var i=0;i<scored.length && lines.length<2;i++){
    var l = scored[i].l;
    if(usedTitles[l.title]) continue;
    usedTitles[l.title] = true;
    if(l.won===true) lines.push("「"+l.title+"」這一局賭贏了，選擇「"+l.choice+"」這步棋走對了。");
    else if(l.won===false) lines.push("「"+l.title+"」這次沒能賭對，「"+l.choice+"」的代價留得很明顯。");
    else if(l.tier==="up2") lines.push("「"+l.title+"」是這段時間最亮眼的一筆，「"+l.choice+"」的選擇收穫扎實。");
    else if(l.tier==="down2") lines.push("「"+l.title+"」是這段時間比較難熬的一關，「"+l.choice+"」這個決定後來讓人有點後悔。");
    else lines.push("「"+l.title+"」也在這段時間發生了，選了「"+l.choice+"」。");
  }
  return lines;
}
/* 用階段/年度起訖的能力值差，挑出變動最大的 1-2 項配上文字敘述，
   不只給玩家看數字增減，也講清楚「文筆變好」具體是指什麼 */
function periodNarrative(path, snap, cur, salesDiff, logSlice){
  var lines = notableEventLines(logSlice);
  var order = PATHS[path].order;
  var deltas = order.map(function(k){ return {k:k, d:cur.stats[k]-snap.stats[k]}; })
    .filter(function(o){ return Math.abs(o.d)>=3; })
    .sort(function(a,b){ return Math.abs(b.d)-Math.abs(a.d); });
  for(var i=0;i<deltas.length && lines.length<3;i++){
    var f = STAT_FLAVOR[path] && STAT_FLAVOR[path][deltas[i].k];
    if(f) lines.push(deltas[i].d>0 ? f.up : f.down);
  }
  var moneyDiff = cur.money-snap.money;
  if(moneyDiff>=15) lines.push("荷包明顯厚了一圈，手頭寬裕不少。");
  else if(moneyDiff<=-15) lines.push("錢包一路失血，手頭越來越緊。");
  var fameDiff = cur.fame-snap.fame;
  if(fameDiff>=5) lines.push("名字被越來越多人記住，走到哪都有人多看一眼。");
  if(salesDiff>0) lines.push("銷量數字持續往上跳，業界都在討論這個名字。");
  if(lines.length===0) lines.push("這段日子過得算平順，沒有太大的起伏，但也在一點一滴地累積。");
  return lines;
}

function stageSummaryHTML(finishedStage){
  var snap = S.stageStartSnapshot;
  if(!snap) return "";
  var order = PATHS[S.path].order, labels = PATHS[S.path].labels;
  var parts = [];
  order.forEach(function(k){
    var diff = S.stats[k]-snap.stats[k];
    if(diff!==0) parts.push('<span class="'+(diff>0?"pos":"neg")+'">'+esc(labels[k])+' '+(diff>0?"+":"")+diff+'</span>');
  });
  var moneyDiff = S.money-snap.money;
  if(moneyDiff!==0) parts.push('<span class="'+(moneyDiff>0?"pos":"neg")+'">財力 '+(moneyDiff>0?"+":"")+moneyDiff+'萬</span>');
  var fameDiff = S.fame-snap.fame;
  if(fameDiff!==0) parts.push('<span class="'+(fameDiff>0?"pos":"neg")+'">知名度 '+(fameDiff>0?"+":"")+fameDiff+'</span>');
  var salesDiff = S.salesTally-snap.sales;
  var salesLine = salesDiff>0
    ? '<p class="stage-sales-highlight">這個階段賣出了 '+salesDiff+' 萬冊，業界都在討論這個數字。</p>'
    : "";
  var logSlice = S.log.filter(function(l){ return l.age>=snap.age && l.age<S.age; });
  var narrative = periodNarrative(S.path, snap, {stats:S.stats, money:S.money, fame:S.fame}, salesDiff, logSlice).map(esc).join(" ");
  return '<div class="entry stage-summary"><div class="etitle">'+esc(finishedStage.label)+' 結算</div>'+
    '<p class="stage-narrative">'+narrative+'</p>'+
    (parts.length ? '<div class="delta">'+parts.join("")+'</div>' : "")+
    salesLine+
    '</div>';
}

/* ---------- turn engine: 1 year = alloc once + EVENTS_PER_YEAR events (年初/仲春/盛夏/歲末) ---------- */
function poolForYear(){
  var stageNo = S.stageIdx+1;
  return 6 + Math.floor(rng()*3) + (stageNo>=3?1:0) + (S.traits.specialist?1:0); // 6-8(+1 late)(+1 specialist)
}

function startYear(){
  S.phase="alloc";
  S.eventsThisYear=0;
  snapshotYear();
  S.allocPool = poolForYear();
  S.allocSpent = {a:0,b:0,c:0,d:0,e:0};
  if(S.stageIdx>0 || S.turnInStage>0){
    var beforeD = S.stats.d;
    S.stats.d = clamp(S.stats.d+5, 0, 100);
    if(S.stats.d>beforeD){
      S.entries.push('<div class="ticker"><b>年初</b><span>年假總算喘了口氣，抗壓性緩緩回升了一些。</span></div>');
    }
    checkBreakthroughs();
  }
  if(S.money < -20){
    var interest = Math.max(2, Math.round(Math.abs(S.money)*0.05));
    S.money -= interest;
    S.flags.hadDebtInterest = true;
    S.entries.push('<div class="ticker"><b>債務</b><span>信用卡循環利息又扣了 '+interest+' 萬，帳戶餘額持續探底。</span></div>');
  }
  checkDebtTier();
  if(checkDebtCrisis()) return;
  render();
}

function confirmAllocation(){
  checkAllocTraits();
  Object.keys(S.allocSpent).forEach(function(k){
    S.stats[k] = clamp(S.stats[k]+S.allocSpent[k],0,100);
  });
  checkBreakthroughs();
  drawEvent();
}

function eligibleEvents(){
  var stageNo = S.stageIdx+1;
  return EVENTS.filter(function(ev){
    if(ev.once && S.usedEvents[ev.id]) return false;
    if(ev.paths.indexOf("all")===-1 && ev.paths.indexOf(S.path)===-1) return false;
    if(stageNo<ev.stageMin || stageNo>ev.stageMax) return false;
    if(ev.requires && !ev.requires(S)) return false;
    if(ev.maxOccurs && (S.eventSeenCount[ev.id]||0)>=ev.maxOccurs) return false;
    if(ev.cooldownYears && S.eventLastAge && S.eventLastAge[ev.id]!==undefined &&
      (S.age-S.eventLastAge[ev.id])<ev.cooldownYears) return false;
    return true;
  });
}

/* repeat 事件抽中 2 次後權重大幅衰減，避免同一段 stale() 三段變文在一輪內被逐字重讀好幾次 */
function effectiveWeight(ev){
  var seen = (S.eventSeenCount && S.eventSeenCount[ev.id]) || 0;
  if(seen>=3) return ev.weight*0.1;
  if(seen>=2) return ev.weight*0.4;
  return ev.weight;
}
/* 選項顯示順序洗牌，避免「永遠選第一個」變成主宰策略；用種子 rng() 產生，重整頁面後仍可重現 */
function shuffledIndices(n){
  var arr = [];
  for(var i=0;i<n;i++) arr.push(i);
  for(var i=arr.length-1;i>0;i--){
    var j = Math.floor(rng()*(i+1));
    var tmp=arr[i]; arr[i]=arr[j]; arr[j]=tmp;
  }
  return arr;
}
function drawEvent(){
  var pool = eligibleEvents();
  if(pool.length===0){ continueAfterEvent(); return; }
  var totalW = pool.reduce(function(s,e){return s+effectiveWeight(e);},0);
  var r = rng()*totalW;
  var chosen = pool[pool.length-1];
  for(var i=0;i<pool.length;i++){ r-=effectiveWeight(pool[i]); if(r<=0){ chosen=pool[i]; break; } }
  S.usedEvents[chosen.id]=true;
  S.eventSeenCount[chosen.id] = (S.eventSeenCount[chosen.id]||0)+1;
  if(chosen.cooldownYears){ S.eventLastAge[chosen.id] = S.age; }
  if(rng()<0.4){
    var tickerPool = TICKERS.filter(function(t){ return t!==S.lastTicker; });
    var ticker = pick(tickerPool.length?tickerPool:TICKERS);
    S.lastTicker = ticker;
    S.entries.push('<div class="ticker"><b>快訊</b><span>'+esc(ticker)+'</span></div>');
  }
  S.pendingEventId = chosen.id;
  S.pendingChoiceOrder = shuffledIndices(chosen.choices.length);
  S.phase="event";
  render(true);
}

function verdictFor(delta){
  var score = 0;
  ["a","b","c","d","e"].forEach(function(k){ if(delta[k]) score += delta[k]; });
  if(delta.money) score += delta.money/2;
  if(delta.fame) score += delta.fame*1.3;
  if(score>=9) return {cls:"up", tier:"up2"};
  if(score>=3) return {cls:"up", tier:"up1"};
  if(score>-3) return {cls:"flat", tier:"flat"};
  if(score>-9) return {cls:"down", tier:"down1"};
  return {cls:"down", tier:"down2"};
}
function genericResult(tier){ return pick(GENERIC_RESULT[tier]); }

function resolveChoice(idx){
  var ev = getPendingEvent();
  var choice = ev.choices[idx];
  var branch = choice;
  var companyAtEvent = S.company;
  var gambleTag = "";
  if(choice.success && choice.fail){
    var chance = typeof choice.chance==="function" ? choice.chance(S) : (choice.chance===undefined?0.5:choice.chance);
    chance = gambleChance(chance);
    var won = rng() < chance;
    branch = won ? choice.success : choice.fail;
    gambleTag = won
      ? '<span class="gamble-tag win">賭贏了</span>'
      : '<span class="gamble-tag lose">賭輸了</span>';
    checkGambleTraits(won);
  }
  var deltaList = fmtDelta(S, branch.delta);
  var verdict = verdictFor(branch.delta);
  applyDelta(S, branch.delta);
  if(S.stageIdx===0 && S.money<0) S.hadNegativeMoneyEarly = true;
  if(choice.style){ S.styleCount[choice.style] = (S.styleCount[choice.style]||0)+1; }
  if(choice.flag) S.flags[choice.flag] = true;
  if(branch.flag) S.flags[branch.flag] = true;
  var companyChange = choice.newCompany || branch.newCompany;
  if(companyChange){
    var newVal = typeof companyChange==="function" ? companyChange(S) : companyChange;
    if(newVal===true){
      var pool = COMPANIES.filter(function(c){ return c!==S.company; });
      S.company = pick(pool);
    } else {
      S.company = newVal;
    }
  }
  var resultText = branch.result || genericResult(verdict.tier);
  var deltaHTML = deltaList.map(function(d){
    var cls = d.val>0?"pos":"neg"; var sign = d.val>0?"+":"";
    return '<span class="'+cls+'">'+esc(d.label)+' '+sign+d.val+(d.unit||"")+'</span>';
  }).join("");
  S.entries.push(
    '<div class="entry"><div class="esub">'+S.age+' 歲 · '+BEAT_LABELS[S.eventsThisYear+1]+'</div>'+
    '<div class="etitle">'+esc(ev.title)+'</div>'+
    '<p>'+esc(ev.desc(S))+'</p>'+
    '<div class="picked">你選擇了：「'+esc(choice.label)+'」'+gambleTag+'</div>'+
    '<div class="result-text"><span class="vdot '+verdict.cls+'"></span><span class="rtxt">'+esc(resultText)+'</span></div>'+
    '<div class="delta">'+(deltaHTML||'<span style="color:var(--dim);background:none;border:none;padding:0;">（沒有明顯變化）</span>')+'</div></div>'
  );
  checkBreakthroughs();
  S.log.push({age:S.age, title:ev.title, choice:choice.label, company:companyAtEvent,
    tier:verdict.tier, won:(choice.success&&choice.fail)?won:null, resultText:resultText});
  S.pendingEventId = null;
  S.phase="post";
  render(true);
}

function continueAfterEvent(){
  S.eventsThisYear++;
  if(checkDebtCrisis()) return;
  if(S.eventsThisYear<EVENTS_PER_YEAR){ drawEvent(); return; }
  afterYear();
}

function afterYear(){
  S.entries.push(yearSummaryHTML());
  if(checkBurnoutCrisis()) return;
  S.turnInStage++;
  S.age++;
  if(S.turnInStage>=STAGES[S.stageIdx].turns){
    var finishedStage = STAGES[S.stageIdx];
    if(finishedStage.key==="rookie" && !S.hadNegativeMoneyEarly) unlockTrait("pennyPincher");
    S.stageIdx++;
    S.turnInStage=0;
    if(S.stageIdx>=STAGES.length){
      S.entries.push(stageSummaryHTML(finishedStage));
      computeEnding();
      return;
    }
    var nextStage = STAGES[S.stageIdx];
    S.entries.push(stageSummaryHTML(finishedStage));
    S.entries.push('<div class="stagebreak">'+finishedStage.label+' 結束　·　邁入 '+nextStage.label+'</div>');
    snapshotStage();
    S.phase="stageend";
    render(true);
    return;
  }
  startYear();
}

function bankruptThreshold(){
  if(S.path==="store") return -(60 + S.stats.e*6);
  return -130;
}

function checkDebtCrisis(){
  if(S.money<=bankruptThreshold()){
    S.forcedEnding = "crushed";
    computeEnding();
    return true;
  }
  return false;
}

/* ---------- 財務懸崖分級：破產線之前不再毫無感覺，跨過警訊/危機兩級門檻會有立即的文字＋數值回饋 ---------- */
var DEBT_TIER_RATIO = [0.5, 0.8]; // 距離破產線的比例：50%＝財務吃緊，80%＝瀕臨破產
function debtRatio(){
  if(S.money>=0) return 0;
  return clamp(S.money/bankruptThreshold(), 0, 1);
}
function debtTierFor(ratio){
  if(ratio>=DEBT_TIER_RATIO[1]) return 2;
  if(ratio>=DEBT_TIER_RATIO[0]) return 1;
  return 0;
}
function pushDebtCard(tier, worsening){
  var text;
  if(worsening){
    text = tier===1
      ? S.name+"的帳戶餘額已經連續好幾個月沒有回正，每次點開對帳單都要先深呼吸一下。"

/* 每年年初檢查一次（跟既有的循環利息判定同一節奏），跨過門檻才觸發卡片跟一次性數值代價，緩衝 0.15 避免在門檻附近反覆橫跳 */
function checkDebtTier(){
  if(!S) return;
  var ratio = debtRatio();
  var cur = S.debtTier||0;
  var target = debtTierFor(ratio);
  if(target>cur){
    S.debtTier = target;
    pushDebtCard(target, true);
    if(target===1){ S.fame = clamp(S.fame-3, 0, 100); }
    else if(target===2){
      S.fame = clamp(S.fame-6, 0, 100);
      var lo = (S.traits && S.traits.battleScarred) ? 16 : 0;
      S.stats.d = clamp(S.stats.d-3, lo, 100);
    }
  } else if(cur>=1){
    var floor = cur===2 ? DEBT_TIER_RATIO[1]-0.15 : DEBT_TIER_RATIO[0]-0.15;
    if(ratio<floor){
      S.debtTier = debtTierFor(ratio);
      pushDebtCard(cur, false);
    }
  }
}

function checkBurnoutCrisis(){
  if(S.stats.d<=15){ S.lowGritStreak = (S.lowGritStreak||0)+1; }
  else{ S.lowGritStreak = 0; }
  if(S.lowGritStreak===2){ S.flags.nearBurnout = true; }
  if(S.flags.nearBurnout && S.lowGritStreak<2) unlockTrait("battleScarred");
  if(S.lowGritStreak>=4){
    S.forcedEnding = "burnout";
    computeEnding();
    return true;
  }
  return false;
}

var ALLOC_PER_STAT_CAP = 5; // 單一能力一年最多加這麼多點，避免「全押同一項」比角色扮演式分散加點更有效率的雪球問題
function allocInc(k){
  if(allocSpentTotal()>=S.allocPool) return;
  if(S.stats[k]+S.allocSpent[k]>=100) return;
  if(S.allocSpent[k]>=ALLOC_PER_STAT_CAP) return;
  S.allocSpent[k]++;
  render();
}
function allocDec(k){
  if(S.allocSpent[k]<=0) return;
  S.allocSpent[k]--;
  render();
}

/* 回傳機率的各項組成，供 UI 顯示「基礎 X%＋精通 Y%＋膽識 Z%」的明細，不是只回一個總數 */
function gambleChanceBreakdown(base){
  var ironNerve = (S && S.traits && S.traits.ironNerve) ? 0.08 : 0;
  var mastered = !!(S && S.breakthroughPeak && ["a","b","c","d","e"].some(function(k){ return S.breakthroughPeak[k]>=2; }));
  var mastery = mastered ? 0.08 : 0; // 精通任一能力就給上限 +8%，不逐項疊加——批次模擬顯示隨機配點下 8 成局都會精通至少一項，逐項疊加會讓多數玩家不知不覺拿到 15-25% 的機率加成，稀缺感就沒了
  var debtPenalty = (S && S.debtTier>=2) ? -0.05 : 0; // 瀕臨破產時判斷力也跟著打折，呼應財務懸崖分級
  return {base:base, ironNerve:ironNerve, mastery:mastery, debtPenalty:debtPenalty, total:clamp(base+ironNerve+mastery+debtPenalty, 0.05, 0.95)};
}
function gambleChance(base){ return gambleChanceBreakdown(base).total; }
function checkGambleTraits(won){
  if(won){
    S.gambleWinStreak = (S.gambleWinStreak||0)+1;
    if(S.gambleWinStreak>=3) unlockTrait("ironNerve");
  } else {
    S.gambleWinStreak = 0;
  }
}
function checkAllocTraits(){
  var total = allocSpentTotal();
  if(total<=0){ S.allocFocusKey=null; S.allocFocusStreak=0; return; }
  var domKey=null, domVal=-1;
  Object.keys(S.allocSpent).forEach(function(k){
    if(S.allocSpent[k]>domVal){ domVal=S.allocSpent[k]; domKey=k; }
  });
  if(domKey===S.allocFocusKey && domVal>=total/2){
    S.allocFocusStreak++;
  } else {
    S.allocFocusKey = (domVal>=total/2) ? domKey : null;
    S.allocFocusStreak = S.allocFocusKey ? 1 : 0;
  }
  if(S.allocFocusStreak>=3) unlockTrait("specialist");
}

var BREAKTHROUGH_THRESH = [50, 82]; // 精通門檻從 75 拉高到 82——75 對集中配點玩家太容易，多數輪都能在 stage 2 就達成，稀缺感不夠
function breakthroughTierFor(val){
  if(val>=BREAKTHROUGH_THRESH[1]) return 2;
  if(val>=BREAKTHROUGH_THRESH[0]) return 1;
  return 0;
}
function pushBreakthroughCard(key, tier, up){
  var label = PATHS[S.path].labels[key];
  var text = up
    ? BREAKTHROUGH_UP[S.path][key][tier-1]
    : BREAKTHROUGH_DOWN[S.path][key];
  S.entries.push(
    '<div class="entry '+(up?"breakthrough":"slump")+'"><div class="esub">'+S.age+' 歲 · '+(up?"能力突破":"能力退步")+'</div>'+
    '<div class="etitle">'+icon(SLOT_ICON[key],(up?"breakthrough-icon":"slump-icon"))+esc(label)+(up?(tier===2?" · 精通":" · 突破"):" · 退步")+'</div>'+
    '<p>'+esc(text)+'</p></div>'
  );
}
/* 每次能力值變動後都要呼叫，跨過 50/75 門檻觸發文字回饋。
   S.breakthroughPeak 記錄「這輩子曾經達到過的最高等級」，只升不降——精通後的 +8% 機率加成掛在這個峰值上，
   不會因為之後小幅回落就悄悄消失，也不會因為又爬回同一個等級而重複跳出同一張卡片。
   S.breakthroughTier 是「目前狀態」，下滑要跌破門檻下方 12 點才觸發退步卡，比原本 6 點的緩衝更能避免在門檻附近反覆橫跳。 */
function checkBreakthroughs(){
  if(!S || !S.breakthroughTier || !S.breakthroughPeak) return;
  ["a","b","c","d","e"].forEach(function(k){
    var val = S.stats[k];
    var cur = S.breakthroughTier[k]||0;
    var peak = S.breakthroughPeak[k]||0;
    var target = breakthroughTierFor(val);
    if(target>peak){
      S.breakthroughPeak[k] = target;
      S.breakthroughTier[k] = target;
      pushBreakthroughCard(k, target, true);
    } else if(target>cur){
      S.breakthroughTier[k] = target; // 回到曾經達到過的等級，已經宣告過一次了，不重複跳卡
    } else if(cur>=1){
      var floor = cur===2 ? BREAKTHROUGH_THRESH[1]-12 : BREAKTHROUGH_THRESH[0]-12;
      if(val<floor){
        S.breakthroughTier[k] = breakthroughTierFor(val);
        pushBreakthroughCard(k, cur, false);
      }
    }
  });
}

function computeTags(){
  var matched = TAGS.filter(function(t){ try{ return t.test(); }catch(e){ return false; } });
  var picked = [];
  var pool = matched.slice();
  while(picked.length<4 && pool.length){
    var i = Math.floor(rng()*pool.length);
    picked.push(pool.splice(i,1)[0].label);
  }
  return picked;
}

function computeEnding(){

  var isCrisis = false;
  if(S.forcedEnding==="crushed" || S.money<=bankruptThreshold()){
    out = crushedEnding(); isCrisis = true;
  } else if(S.forcedEnding==="burnout"){
    out = burnoutEnding(); isCrisis = true;
  } else if(path==="author"){ out = authorEnding(); }
  else if(path==="editor"){ out = editorEnding(); }
  else if(path==="marketing"){ out = marketingEnding(); }
  else if(path==="translator"){ out = translatorEnding(); }
  else { out = storeEnding(); }
  if(!isCrisis){
    out.text += styleNote();
    if(S.money<-15) out.text += " "+debtNote();

  out.text += marriedNote();
  S.ending = out;
  S.ending.tags = computeTags();
  S.ending.traits = Object.keys(S.traits).filter(function(k){ return S.traits[k]; }).map(function(k){ return TRAIT_DEFS[k]; });
  recordCareerLog();
  S.phase="ending";
  render(true);
}

      text:S.company+"開了好幾年，接案量時好時壞，"+S.name+"還在硬撐，但至少每個案子上頭寫的，都是自己的名字。"};
  }
  if(s.b>=65 && s.c>=58 && S.fame>=52){
    return {tag:"great", title:"業界傳奇操盤手",
      text:S.name+"的名字成了行銷企劃課的案例，年輕行銷人視為典範。每次新書要衝銷量，同業第一句話都是「這案子能不能挖到"+S.name+"」。"};
  }
  if(s.b>=55 && s.c>=45){
    return {tag:"good", title:"資深行銷經理",
      text:S.name+"手上經手的企劃案有成有敗，但整體戰績讓公司離不開這個人。加薪單上的數字，是這些年熬夜換來的。"};
  }
  if(S.fame<=15 && S.flags.prDisaster){
    return {tag:"bad", title:"黯然離職",
      text:S.name+"因為一場處理不當的公關風暴，在會議室裡遞出辭呈。離開那天，同事送的卡片上寫著「辛苦了」，沒人多說什麼。"};
  }
  return {tag:"neutral", title:"平凡但踏實的行銷人",
    text:S.name+"沒有大熱案子，也沒有大災難，就這樣一檔接一檔地把案子做完。這份工作教會他最重要的事：預算永遠不夠，截止日永遠提前。"};
}

function translatorEnding(){
  var s=S.stats;
  if(S.salesTally>=40){
    if(S.flags.wonBooker){
      return {tag:"great", title:"國際布克獎得主",
        text:S.name+"從梁實秋文學獎一路打進國際布克獎的決選台，鏡頭第一次真正對準了「譯者」這兩個字。長年隱形的名字，終於被念了出來，還跟作者並列在同一份獎座上。"};
    }
    if(S.flags.wonLiangAward){
      return {tag:"great", title:"梁實秋文學獎得主的接案生涯",
        text:S.name+"那座梁實秋文學獎的獎座，成了往後每次接案時最有份量的一句話。編輯開口的語氣都不一樣了。"};
    }
    return {tag:"great", title:"意外爆紅的譯者",
      text:S.name+"翻譯的那本書意外賣到嚇人，讀者第一次開始在乎「這是誰翻的」，長年隱形的名字，終於被記住了。"};
  }
  if(s.a>=68 && s.b>=64 && S.fame>=42){
    return {tag:"great", title:"讓原作者親自道謝的譯者",
      text:S.name+"翻譯的作品拿下國際翻譯獎，原作者在得獎感言裡特別提到「沒有這個譯本，我的書到不了這裡」。長年隱形的名字，終於被念了出來。"};
  }
  if(s.a>=60 && s.c>=50){
    return {tag:"good", title:"編輯搶著指定的資深譯者",
      text:S.name+"接案不再需要主動投履歷，反而是編輯搶著把稿子留給他。價碼依然稱不上優渥，但至少，案子從不斷。"};
  }
  if(S.money>=0 && s.a>=45){
    return {tag:"neutral", title:"穩定接案的職業譯者",
      text:S.name+"的名字很少出現在書封上，卻穩穩出現在一本又一本書的版權頁裡。沒有人記得他的臉，但很多人讀過他的字。"};
  }
  if(s.d<=25 || S.flags.disappeared){
    return {tag:"bad", title:"轉職：從此不再回覆任何一封邀稿信",
      text:S.name+"最終也活成了自己曾經恐懼的那種傳說——一封邀稿信、一句「已讀不回」，然後徹底消失在業界的通訊錄裡。"};
  }
  return {tag:"neutral", title:"在deadline裡浮沉的自由譯者",
    text:S.name+"還在接案，還在趕稿，行事曆上永遠有下一個死線。這份工作沒有掌聲，只有一本又一本悄悄完成的書。"};
}

function storeEnding(){
  var s=S.stats;
  if(S.flags.retailManager){
    return {tag:"good", title:"轉戰連鎖書店的店長",
      text:S.name+"在連鎖書店的制服裡，找到了另一種顧書的方式。少了自己當老闆的自由，但月底薪水準時入帳，這種安穩，也是這些年少有的奢侈。"};
  }
  if(S.flags.bookConsultant){
    return {tag:"good", title:"獨立書店界的選書顧問",
      text:S.name+"把自己開店的血淚，變成了一份份選書顧問報告。沒有自己的店面了，但業界都知道，找他談選書準沒錯。"};
  }
  if(S.flags.leftBookIndustry){
    return {tag:"neutral", title:"轉身離開的書店老闆",
      text:S.name+"徹底離開了這一行，書架上的書慢慢換成別的東西。偶爾路過書店，還是會忍不住多看兩眼，但那份鄉愁，僅止於此。"};
  }
  if(S.flags.onlineOnlyPivot){
    return {tag:"good", title:"全職經營的線上選書店",
      text:S.name+"的網路選書店做得有聲有色，訂單來自全台各地。少了實體店的溫度，卻也多了一種再也不用管房租漲跌的自由。"};
  }
  if(S.flags.boutiqueStudio){
    return {tag:"good", title:"預約制的選書工作室",
      text:S.name+"的店變小了，卻也變得更像自己。每一位上門的客人，都是專程為了這份挑剔的品味而來。"};
  }
  if(S.flags.worldFeaturedStore){
    return {tag:"great", title:"登上國際媒體的書店地標",
      text:S.name+"的店被國際媒體選進「全球最美書店」專題，報導刊出那天，訊息多到"+S.name+"一整天沒空整理書架。這條巷子，從此多了一個外國遊客也認得的地標。"};
  }
  if(s.b>=58 && s.c>=55 && S.fame>=50){
    return {tag:"great", title:"全國知名的獨立書店地標",
      text:S.name+"的店成了外國媒體介紹「亞洲最美書店」名單上的常客。遊客專程來拍照，老讀者則專程來買書——"+S.name+"用品味守住了一整條街的靈魂。"};
  }
  if(s.a>=55 && S.money>=0){
    return {tag:"good", title:"穩定經營的社區書店",
      text:S.name+"的店不是打卡熱點，卻是附近居民下班會順路走進去的地方。租金依然沉重，但這間店，早就成了社區記憶的一部分。"};
  }
  if(s.d<=25){
    return {tag:"bad", title:"腰傷退場",
      text:S.name+"的腰終究還是沒撐住，醫生下了最後通牒。看著滿牆的書，"+S.name+"第一次認真考慮把店頂讓出去。"};
  }
  if(S.money<0 && S.money>bankruptThreshold()){
    return {tag:"neutral", title:"苦撐著活下來的小書店",
      text:S.name+"的店帳面上沒有一年是好看的，但總能在快撐不下去的時候，剛好有筆訂單、剛好有場活動，把店續了下去。"};
  }
  return {tag:"neutral", title:"持續守著一盞燈的書店老闆",
    text:S.name+"的店不大，燈卻幾乎每晚都亮到最後。這一行沒有暴富的故事，只有一頁一頁翻過去的日子。"};
}

function esc(s){ return String(s).replace(/[&<>]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c];}); }

function statBarsHTML(){

    return '<div class="cell" style="--accent:'+SLOT_COLOR[k]+'"><span class="k">'+icon(SLOT_ICON[k])+labels[k]+'</span><span class="v">'+S.stats[k]+'</span>'+

function lampsHTML(){
  return '<div class="lamps">'+BEAT_LABELS.map(function(label,i){
    var cls = "lamp";
    if((i>0 && i<=S.eventsThisYear) || (i===0 && S.phase!=="alloc")) cls+=" done";
    if((i===0 && S.phase==="alloc") || (i===S.eventsThisYear+1 && (S.phase==="event"||S.phase==="post"))) cls+=" now";
    return '<span class="'+cls+'">'+label+'</span>';
  }).join("")+'</div>';
}

function headerHTML(){
  var stage = STAGES[S.stageIdx];
  return '<div class="hdr">'+
    '<div class="topline"><span class="stage-pill">'+stage.label+' · 第 '+(S.turnInStage+1)+'/'+stage.turns+' 年</span>'+
    '<span>'+S.age+' 歲 · '+PATHS[S.path].noun+' '+esc(S.name)+(S.company?' · '+esc(S.company):'')+' · 種子 '+esc(S.seed)+'</span></div>'+
    lampsHTML()+statBarsHTML()+
    '</div>';
}

function render(scrollDown){
  var app = document.getElementById("app");
  if(!S){ app.innerHTML = renderStart(); bindStart(); return; }
  if(S.phase==="ending"){ clearProgress(); app.innerHTML = renderEnding(); bindEnding(); return; }
  saveProgress();

  var pendingLog = "";
  var footer = "";
  if(S.phase==="alloc"){
    footer = renderAllocFooter();
  } else if(S.phase==="event"){
    var ev = getPendingEvent();
    pendingLog = '<div class="entry pending"><div class="esub">'+S.age+' 歲 · '+BEAT_LABELS[S.eventsThisYear+1]+'</div>'+
      '<div class="etitle">'+esc(ev.title)+'</div><p>'+esc(ev.desc(S))+'</p></div>';
    var order = (S.pendingChoiceOrder && S.pendingChoiceOrder.length===ev.choices.length)
      ? S.pendingChoiceOrder
      : ev.choices.map(function(c,i){ return i; });
    footer = '<div class="choices">'+order.map(function(i){
      var c = ev.choices[i];
      var oddsHTML = "";
      if(c.success && c.fail){
        var baseChance = typeof c.chance==="function" ? c.chance(S) : (c.chance===undefined?0.5:c.chance);
        var bd = gambleChanceBreakdown(baseChance);
        var pct = Math.round(bd.total*100);
        var breakdownBits = [];
        if(bd.mastery>0) breakdownBits.push("精通 +"+Math.round(bd.mastery*100)+"%");
        if(bd.ironNerve>0) breakdownBits.push("膽識 +"+Math.round(bd.ironNerve*100)+"%");
        if(bd.debtPenalty<0) breakdownBits.push("財務壓力 "+Math.round(bd.debtPenalty*100)+"%");
        var breakdownText = breakdownBits.length ? "（基礎 "+Math.round(bd.base*100)+"%＋"+breakdownBits.join("＋")+"）" : "";
        oddsHTML = '<span class="odds">放手一搏 · 成功機率 '+pct+'%'+esc(breakdownText)+'</span>';
        var failDeltas = fmtDelta(S, c.fail.delta).filter(function(d){ return d.val<0; });
        if(failDeltas.length){
          var riskText = failDeltas.map(function(d){ return d.label+" "+d.val+(d.unit||""); }).join("／");
          oddsHTML += '<span class="risk">賭輸的代價：'+esc(riskText)+'</span>';
        }
      }
      return '<button class="choice" data-choice="'+i+'">'+esc(c.label)+oddsHTML+'</button>';
    }).join("")+'</div>';
  } else if(S.phase==="post"){
    footer = '<div class="actions"><button class="primary" id="nextBtn">繼續</button></div>';
  } else if(S.phase==="stageend"){
    var nextStage = STAGES[S.stageIdx];
    footer = '<div class="actions"><button class="primary" id="stageContinue">進入'+nextStage.label+'</button></div>';
  }

  app.innerHTML = headerHTML()+
    '<div class="log" id="logArea">'+S.entries.join("")+pendingLog+'</div>'+
    '<div class="ftr ftr-'+S.phase+'" id="ftrArea">'+footer+'</div>';

  bindPhase();
  if(S.phase==="post"){
    var logEl = document.getElementById("logArea");
    var last = logEl && logEl.lastElementChild;
    if(last && last.classList.contains("entry")) last.classList.add("fresh");
  }
  if(scrollDown){
    requestAnimationFrame(function(){ window.scrollTo({top:document.body.scrollHeight, behavior:"auto"}); });
  }
}

function bindPhase(){
  if(S.phase==="alloc"){
    document.querySelectorAll("[data-inc]").forEach(function(b){ b.addEventListener("click", function(){ allocInc(b.getAttribute("data-inc")); }); });
    document.querySelectorAll("[data-dec]").forEach(function(b){ b.addEventListener("click", function(){ allocDec(b.getAttribute("data-dec")); }); });
    var cb = document.getElementById("confirmAlloc");
    if(cb) cb.addEventListener("click", confirmAllocation);
  } else if(S.phase==="event"){
    document.querySelectorAll("[data-choice]").forEach(function(b){
      b.addEventListener("click", function(){ resolveChoice(parseInt(b.getAttribute("data-choice"),10)); });
    });
  } else if(S.phase==="post"){
    var nb = document.getElementById("nextBtn");
    if(nb) nb.addEventListener("click", continueAfterEvent);
  } else if(S.phase==="stageend"){
    var sc = document.getElementById("stageContinue");
    if(sc) sc.addEventListener("click", continueFromStageEnd);
  }
}

/* allocation footer */
function renderAllocFooter(){
  var order = PATHS[S.path].order, labels=PATHS[S.path].labels;
  var spent = allocSpentTotal();
  var rows = order.map(function(k){
    var val = S.stats[k]+S.allocSpent[k];
    var atCap = S.allocSpent[k]>=ALLOC_PER_STAT_CAP;
    return '<div class="alloc-row"><span class="alloc-name">'+labels[k]+(atCap?' <span class="alloc-cap-tag">單年上限</span>':'')+'</span>'+
      '<div class="alloc-bar"><i style="width:'+clamp(val,0,100)+'%"></i></div>'+
      '<div class="alloc-btns"><button data-dec="'+k+'" '+(S.allocSpent[k]<=0?"disabled":"")+'>−</button>'+
      '<button data-inc="'+k+'" '+((spent>=S.allocPool||val>=100||atCap)?"disabled":"")+'>＋</button></div></div>';
  }).join("");
  return '<p class="hint">年初：這一年能投入的心力有限，分配給誰，決定接下來會遇上什麼。單一能力一年最多投入 '+ALLOC_PER_STAT_CAP+' 點，逼自己多方發展。</p>'+
    '<div class="pool">可分配點數：'+(S.allocPool-spent)+' / '+S.allocPool+'</div>'+
    rows+
    '<div class="actions"><button class="primary" id="confirmAlloc">確定分配，迎接這一年</button></div>';
}

function bgPickerHTML(){

function bindStart(){
  var resumeBtn = document.getElementById("resumeBtn");
  if(resumeBtn) resumeBtn.addEventListener("click", resumeProgress);
  var discardBtn = document.getElementById("discardSaveBtn");
  if(discardBtn) discardBtn.addEventListener("click", function(){ clearProgress(); render(); });

  var picker = document.getElementById("pathPicker");
  function selectPathCard(card){
    if(!card) return;
    startPath = card.getAttribute("data-path");
    Array.prototype.forEach.call(picker.children, function(c){
      var sel = c===card;
      c.classList.toggle("sel", sel);
      c.setAttribute("aria-pressed", sel?"true":"false");
    });
    document.getElementById("bgWrap").innerHTML = bgPickerHTML();
  }
  picker.addEventListener("click", function(e){
    selectPathCard(e.target.closest(".pathcard"));
  });
  picker.addEventListener("keydown", function(e){
    if(e.key!=="Enter" && e.key!==" " && e.key!=="Spacebar") return;
    var card = e.target.closest(".pathcard");
    if(!card) return;
    e.preventDefault();
    selectPathCard(card);
  });
  bindSeedArea();
  document.getElementById("startBtn").addEventListener("click", function(){
    var name = document.getElementById("nameInput").value.trim();
    if(!startPath){ alert("請先選擇一條路線。"); return; }
    var seedEl = document.getElementById("seedInput");
    seedInput = seedEl ? seedEl.value.trim() : "";
    var bgEl = document.querySelector('input[name="bg"]:checked');
    newGame(name, startPath, bgEl?bgEl.value:"normal");
  });
}

function lastEntryOfClass(cls){
  for(var i=S.entries.length-1;i>=0;i--){
    if(S.entries[i].indexOf('class="entry '+cls)!==-1) return S.entries[i];
  }
  return null;
}

  var historyLines = S.log.map(function(l){
    return l.age+' 歲　'+(l.company?esc(l.company)+'　':'')+esc(l.title)+'　→　'+esc(l.choice);

      '</div>' : "")+
    statBarsHTML()+
    ((lastYear||lastStage) ? '<div class="sub" style="margin-top:14px;">生涯終章回顧</div>'+(lastStage||"")+(lastYear||"") : "")+
    '<details class="history-details" style="margin-top:14px;"><summary class="sub" style="cursor:pointer;">生涯記事（共 '+S.log.length+' 則，點開展開）</summary>'+
    '<div class="history">'+(historyLines||"（平淡的一生，沒留下什麼紀錄）")+'</div></details>'+
    '<div class="actions"><button class="primary" id="downloadCardBtn">下載結果卡（圖片）</button>'+
    '<button class="ghost" id="restartBtn">重新開始人生</button>'+
    '<button class="ghost" id="sameSeedBtn">用同一顆種子再來一次</button></div>'+
    '</div>';
}
function bindEnding(){
  document.getElementById("downloadCardBtn").addEventListener("click", downloadResultCard);
  document.getElementById("restartBtn").addEventListener("click", function(){ S=null; seedInput=""; startPath=null; render(); window.scrollTo(0,0); });
  document.getElementById("sameSeedBtn").addEventListener("click", function(){
    var seed=S.seed, path=S.path, name=S.name, bg=S.background;
    seedInput = seed;
    newGame(name, path, bg);
    window.scrollTo(0,0);
  });
}

/* ---------- shareable result card ---------- */
var TAG_COLOR = { great:"#d3a24d", good:"#8fbf8a", neutral:"#a89d86", bad:"#d9705a" };
var TAG_TEXT = { great:"GREAT ENDING", good:"GOOD ENDING", neutral:"NEUTRAL ENDING", bad:"BAD ENDING" };

function wrapText(ctx, text, x, y, maxWidth, lineHeight){
  var chars = String(text).split("");
  var line = "";
  var lines = [];
  for(var i=0;i<chars.length;i++){
    var test = line+chars[i];
    if(ctx.measureText(test).width>maxWidth && line!==""){ lines.push(line); line=chars[i]; }
    else{ line=test; }
  }
  if(line) lines.push(line);
  lines.forEach(function(l,idx){ ctx.fillText(l, x, y+idx*lineHeight); });
  return lines.length*lineHeight;
}

function makeResultCardDataURL(){
  var e = S.ending;
  var W=800, H=1000;
  var cv = document.createElement("canvas");
  cv.width=W; cv.height=H;
  var ctx = cv.getContext("2d");

  ctx.fillStyle = "#14120f";
  ctx.fillRect(0,0,W,H);
  ctx.strokeStyle = "#3a3226";
  ctx.lineWidth = 2;
  ctx.strokeRect(24,24,W-48,H-48);

  ctx.fillStyle = "#a89d86";
  ctx.font = "13px monospace";
  ctx.fillText("PUBLISHING LIFE SIMULATOR", 56, 76);

  ctx.fillStyle = TAG_COLOR[e.tag]||"#a89d86";
  ctx.font = "bold 13px monospace";
  ctx.fillText(TAG_TEXT[e.tag]||"ENDING", 56, 102);
  ctx.strokeStyle = TAG_COLOR[e.tag]||"#a89d86";
  ctx.strokeRect(50,86,ctx.measureText(TAG_TEXT[e.tag]||"ENDING").width+14,24);

  ctx.fillStyle = "#ece4d2";
  ctx.font = "bold 40px serif";
  var titleH = wrapText(ctx, e.title, 56, 168, W-112, 48);

  var subY = 168+titleH+18;
  ctx.fillStyle = "#a89d86";
  ctx.font = "16px serif";
  ctx.fillText(PATHS[S.path].noun+" "+S.name+"　·　"+S.age+" 歲", 56, subY);

  ctx.strokeStyle = "#3a3226";
  ctx.beginPath(); ctx.moveTo(56, subY+24); ctx.lineTo(W-56, subY+24); ctx.stroke();

  ctx.fillStyle = "#ece4d2";
  ctx.font = "17px serif";
  var bodyY = subY+66;
  bodyY += wrapText(ctx, e.text, 56, bodyY, W-112, 30);

  var order = PATHS[S.path].order, labels = PATHS[S.path].labels;
  var statsY = Math.max(bodyY+50, H-360);
  ctx.fillStyle = "#d3a24d";
  ctx.font = "12px monospace";
  ctx.fillText("FINAL STATUS", 56, statsY);
  statsY += 26;
  var colW = (W-112)/2;
  var allStats = order.map(function(k){ return {label:labels[k], val:S.stats[k], max:100}; });
  allStats.push({label:"財力", val:S.money, unit:" 萬"});
  allStats.push({label:"知名度", val:S.fame, max:100});
  allStats.forEach(function(st,i){
    var col = i%2, row = Math.floor(i/2);
    var x = 56+col*colW, y = statsY+row*54;
    ctx.fillStyle = "#a89d86";
    ctx.font = "12px monospace";
    ctx.fillText(st.label, x, y);
    ctx.fillStyle = "#ece4d2";
    ctx.font = "bold 20px monospace";
    ctx.fillText(String(st.val)+(st.unit||""), x, y+24);
    if(st.max){
      ctx.strokeStyle="#3a3226"; ctx.fillStyle="#3a3226";
      ctx.fillRect(x, y+30, colW-20, 4);
      ctx.fillStyle = "#c1503a";
      ctx.fillRect(x, y+30, Math.max(0,Math.min(1,st.val/st.max))*(colW-20), 4);
    }
  });

  if(e.tags && e.tags.length){
    var tagY = H-78;
    ctx.font = "13px monospace";
    var tx = 56;
    e.tags.forEach(function(tag){
      var w = ctx.measureText(tag).width+18;
      if(tx+w>W-56){ tx=56; tagY+=26; }
      ctx.strokeStyle = "#d3a24d";
      ctx.strokeRect(tx, tagY-16, w, 22);
      ctx.fillStyle = "#d3a24d";
      ctx.fillText(tag, tx+9, tagY);
      tx += w+8;
    });
  }

  ctx.fillStyle = "#a89d86";
  ctx.font = "11px monospace";
  ctx.fillText("種子 "+S.seed+"　·　publishing-life-simulator", 56, H-40);

  return cv.toDataURL("image/png");
}

function downloadResultCard(){
  var url = makeResultCardDataURL();
  var a = document.createElement("a");
  a.href = url;
  a.download = "出版人生-"+S.name+"-"+S.ending.title+".png";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

render();
})();
</script>
