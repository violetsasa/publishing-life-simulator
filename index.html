<!-- title -->
<title>出版人生模擬器</title>

<style>
:root{
  --bg:#fef6e8;
  --panel:#fffdf8;
  --panel2:#fff1da;
  --rule:#f2dcb0;
  --chalk:#3a2c18;
  --dim:#a1876a;
  --red:#ff6a4d;
  --gold:#f5a623;
  --good:#3cb878;
  --bad:#ef4d5e;
  --teal:#2bb3a3;
  --font-display: "Iowan Old Style","Palatino Linotype","Songti TC","PMingLiU",Georgia,serif;
  --font-body: "Palatino Linotype","Iowan Old Style","PMingLiU",Georgia,serif;
  --font-mono: ui-monospace,"IBM Plex Mono","SF Mono",Consolas,"Cascadia Mono",monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:
    radial-gradient(ellipse 900px 500px at 50% -10%, rgba(245,166,35,0.16), transparent 60%),
    radial-gradient(ellipse 700px 400px at 90% 10%, rgba(255,106,77,0.08), transparent 60%),
    var(--bg);
  color:var(--chalk);
  font-family:var(--font-body);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
.icon{ display:inline-block; vertical-align:middle; fill:currentColor; flex-shrink:0; }
@keyframes floatIcon{ 0%,100%{ transform:translateY(0) rotate(-2deg); } 50%{ transform:translateY(-3px) rotate(2deg); } }
.logo-icon{ width:30px; height:auto; color:var(--gold); margin-right:6px; animation:floatIcon 3.2s ease-in-out infinite; }
.pathcard .picon-wrap{
  width:44px; height:44px; border-radius:50%; background:var(--panel);
  display:flex; align-items:center; justify-content:center; margin-bottom:10px;
  border:2px solid var(--accent, var(--rule));
  transition:transform .25s cubic-bezier(.34,1.56,.64,1);
}
.pathcard .picon{ width:24px; height:auto; color:var(--accent, var(--red)); transition:transform .25s ease; }
.pathcard:hover .picon-wrap{ transform:scale(1.1) rotate(-6deg); }
.pathcard:hover .picon{ transform:scale(1.08); }
.ledger .cell .icon{ width:15px; height:auto; color:var(--accent, var(--gold)); margin-bottom:1px; }
.ledger .k{ display:flex; align-items:center; gap:4px; }
.ending-icon-wrap{ display:flex; justify-content:center; margin-bottom:10px; }
@keyframes trophyPop{ 0%{ transform:scale(0) rotate(-15deg); opacity:0; } 60%{ transform:scale(1.15) rotate(6deg); opacity:1; } 100%{ transform:scale(1) rotate(0); } }
.ending-icon{ width:64px; height:auto; color:var(--gold); animation:trophyPop .5s cubic-bezier(.34,1.56,.64,1); }
@media (prefers-reduced-motion: reduce){ .logo-icon, .ending-icon{ animation:none; } }
button{ font:inherit; }
.wrap{ max-width:720px; margin:0 auto; padding:0 16px 40px; }
.masthead{
  display:flex; align-items:baseline; justify-content:space-between;
  padding:22px 0 14px; flex-wrap:wrap; gap:8px;
}
.masthead h1{
  font-family:var(--font-display); font-weight:700; font-size:1.4rem;
  letter-spacing:.02em; margin:0; text-wrap:balance; color:var(--chalk);
}
.masthead .kicker{
  font-family:var(--font-mono); font-size:.66rem; letter-spacing:.14em;
  text-transform:uppercase; color:var(--dim);
}

/* ---- app shell: sticky header, scrolling log, sticky footer ---- */
.shell{ display:flex; flex-direction:column; }
.hdr{
  position:sticky; top:0; z-index:5;
  background:var(--panel);
  border:1px solid var(--rule); border-bottom:none;
  border-radius:14px 14px 0 0;
  box-shadow:0 2px 10px rgba(58,44,24,.05);
  padding:14px 16px 10px;
}
.topline{
  display:flex; justify-content:space-between; align-items:baseline; flex-wrap:wrap; gap:6px;
  font-family:var(--font-mono); font-size:.7rem; color:var(--dim); letter-spacing:.04em; margin-bottom:10px;
}
.stage-pill{
  display:inline-block; border:1px solid var(--gold); color:var(--gold); padding:2px 10px;
  border-radius:20px; font-family:var(--font-mono); font-size:.66rem; letter-spacing:.08em;
}
.lamps{ display:flex; gap:6px; margin-bottom:10px; }
.lamp{
  flex:1; text-align:center; font-family:var(--font-mono); font-size:.62rem; letter-spacing:.06em;
  color:var(--dim); padding:5px 4px; border:1px solid var(--rule); border-radius:4px; background:var(--panel2);
}
.lamp.done{ color:var(--bg); background:var(--gold); border-color:var(--gold); }
@keyframes pillPulse{ 0%,100%{ box-shadow:0 0 0 rgba(245,166,35,.4); } 50%{ box-shadow:0 0 9px rgba(245,166,35,.55); } }
.lamp.now{ color:var(--gold); border-color:var(--gold); background:var(--panel); animation:pillPulse 1.6s ease-in-out infinite; }
@media (prefers-reduced-motion: reduce){ .lamp.now{ animation:none; } }

.ledger{
  display:grid; grid-template-columns:repeat(auto-fit,minmax(84px,1fr));
  gap:8px 12px; font-family:var(--font-mono);
}
.ledger .cell{ display:flex; flex-direction:column; gap:4px; }
.ledger .k{ font-size:.6rem; letter-spacing:.06em; color:var(--dim); text-transform:uppercase; white-space:nowrap;}
.ledger .v{ font-size:.9rem; font-variant-numeric:tabular-nums; font-weight:600; color:var(--chalk);}
.ledger .bar{ height:5px; background:var(--rule); border-radius:3px; overflow:hidden; }
.ledger .bar i{ display:block; height:100%; background:var(--accent, var(--red)); border-radius:3px; transition:width .3s cubic-bezier(.34,1.56,.64,1); }
.ledger .money.neg .v{ color:var(--bad); }

.log{
  background:var(--bg);
  border-left:1px solid var(--rule); border-right:1px solid var(--rule);
  padding:4px 16px; display:flex; flex-direction:column; gap:10px;
}
.entry{
  border-left:2px solid var(--rule); padding:10px 0 10px 14px;
}
.entry.pending{ border-left-color:var(--gold); }
.entry.trait{ border-left-color:var(--gold); background:rgba(245,166,35,0.08); border-radius:0 6px 6px 0; }
.entry.trait .etitle{ color:var(--gold); display:flex; align-items:center; gap:6px; }
.entry.trait .trait-icon{ width:18px; height:auto; color:var(--gold); }
.entry.trait p{ font-size:.86rem; color:var(--dim); }
.traitlist{ display:flex; flex-direction:column; gap:8px; margin:4px 0 20px; }
.traitlist .tcard{ border:1px solid var(--gold); border-radius:6px; padding:8px 12px; background:rgba(245,166,35,0.06); }
.traitlist .tname{ font-family:var(--font-display); font-size:.92rem; color:var(--gold); display:flex; align-items:center; gap:6px; margin-bottom:2px; }
.traitlist .tname .icon{ width:15px; height:auto; }
.traitlist .tdesc{ font-size:.78rem; color:var(--dim); line-height:1.5; }
.entry .etitle{ font-family:var(--font-display); font-size:1.05rem; margin:0 0 4px; color:var(--chalk); text-wrap:balance;}
.entry .esub{ font-family:var(--font-mono); font-size:.62rem; color:var(--dim); letter-spacing:.08em; text-transform:uppercase; margin-bottom:6px;}
.entry p{ margin:0 0 8px; line-height:1.7; font-size:.95rem; color:var(--chalk); }
.entry .picked{ font-size:.86rem; color:var(--dim); border-left:2px solid var(--gold); padding-left:10px; margin:8px 0 8px;}
.gamble-tag{
  display:inline-block; margin-left:8px; font-family:var(--font-mono); font-size:.66rem;
  letter-spacing:.04em; padding:2px 8px; border-radius:10px; vertical-align:middle;
  animation:chipPop .3s cubic-bezier(.34,1.56,.64,1);
}
.gamble-tag.win{ color:var(--good); border:1px solid var(--good); background:rgba(60,184,120,.14); }
.gamble-tag.lose{ color:var(--bad); border:1px solid var(--bad); background:rgba(239,77,94,.14); }
.result-text{ display:flex; gap:8px; align-items:flex-start; margin:2px 0 10px; }
.result-text .vdot{ display:inline-block; width:7px; height:7px; border-radius:50%; margin-top:8px; flex-shrink:0; }
.result-text .vdot.up{ background:var(--good); }
.result-text .vdot.down{ background:var(--bad); }
.result-text .vdot.flat{ background:var(--dim); }
.result-text span.rtxt{ font-size:.92rem; line-height:1.65; color:var(--chalk); }
.delta{ display:flex; flex-wrap:wrap; gap:6px 8px; margin-top:2px; }
.delta span{
  font-family:var(--font-mono); font-size:.78rem; font-weight:700;
  padding:3px 9px; border-radius:20px; letter-spacing:.02em;
  animation:chipPop .32s cubic-bezier(.34,1.56,.64,1) backwards;
}
.delta span:nth-child(2){ animation-delay:.05s; }
.delta span:nth-child(3){ animation-delay:.1s; }
.delta span:nth-child(4){ animation-delay:.15s; }
@keyframes chipPop{ from{ transform:scale(.4); opacity:0; } to{ transform:scale(1); opacity:1; } }
@media (prefers-reduced-motion: reduce){ .gamble-tag, .delta span{ animation:none; } }
.delta span.pos{ color:var(--good); background:rgba(60,184,120,0.16); border:1px solid rgba(60,184,120,0.4); }
.delta span.neg{ color:var(--bad); background:rgba(239,77,94,0.16); border:1px solid rgba(239,77,94,0.4); }
@keyframes entrypop{ from{ transform:scale(.985); opacity:.4; } to{ transform:scale(1); opacity:1; } }
.entry.fresh{ animation:entrypop .28s ease-out; }
@media (prefers-reduced-motion: reduce){ .entry.fresh{ animation:none; } }
.ticker{
  font-family:var(--font-mono); font-size:.72rem; color:var(--dim);
  border-left:2px solid var(--gold); padding:6px 0 6px 14px; display:flex; gap:8px;
}
.ticker b{ color:var(--gold); font-weight:700; }
.stagebreak{
  text-align:center; font-family:var(--font-mono); font-size:.68rem; letter-spacing:.1em;
  color:var(--gold); text-transform:uppercase; padding:10px 0; border-top:1px dashed var(--rule); border-bottom:1px dashed var(--rule);
}

.ftr{
  position:sticky; bottom:0; z-index:5;
  background:var(--panel); border:1px solid var(--rule); border-top:1px solid var(--rule);
  border-radius:0 0 14px 14px; box-shadow:0 -2px 10px rgba(58,44,24,.05); padding:14px 16px;
}
.ftr .hint{ font-family:var(--font-mono); font-size:.68rem; color:var(--dim); margin:0 0 10px; letter-spacing:.02em;}

/* choices */
.choices{ display:flex; flex-direction:column; gap:8px; }
button.choice{
  text-align:left; font-family:var(--font-body); font-size:.92rem;
  background:var(--panel2); border:1px solid var(--rule); color:var(--chalk);
  padding:11px 14px; cursor:pointer; line-height:1.5; border-radius:9px;
  transition:transform .12s cubic-bezier(.34,1.56,.64,1), background .15s ease, border-color .15s ease, box-shadow .15s ease;
}
button.choice:hover{ background:var(--red); color:var(--chalk); border-color:var(--red); transform:translateX(3px); box-shadow:0 3px 10px rgba(255,106,77,.25); }
button.choice:active{ transform:scale(.98); }
button.choice:focus-visible{ outline:2px solid var(--gold); outline-offset:2px; }
button.choice .odds{
  display:block; font-family:var(--font-mono); font-size:.66rem; letter-spacing:.04em;
  color:var(--gold); margin-top:4px; opacity:.85;
}
button.choice:hover .odds{ color:var(--chalk); }
button.primary{
  font-family:var(--font-mono); font-size:.76rem; letter-spacing:.08em; text-transform:uppercase;
  background:var(--gold); color:var(--bg); border:1px solid var(--gold); border-radius:9px;
  padding:11px 20px; cursor:pointer; font-weight:700;
  transition:transform .15s cubic-bezier(.34,1.56,.64,1), background .15s ease, border-color .15s ease, box-shadow .15s ease;
}
button.primary:hover{ background:var(--red); border-color:var(--red); color:var(--chalk); transform:scale(1.04) rotate(-1deg); box-shadow:0 4px 12px rgba(255,106,77,.3);}
button.primary:active{ transform:scale(.97) rotate(0); }
button.primary:focus-visible{ outline:2px solid var(--chalk); outline-offset:2px;}
button.ghost{
  font-family:var(--font-mono); font-size:.7rem; letter-spacing:.05em;
  background:transparent; border:1px solid var(--rule); color:var(--dim); border-radius:9px;
  padding:8px 14px; cursor:pointer; transition:border-color .15s ease, color .15s ease, transform .12s ease;
}
button.ghost:hover{ border-color:var(--gold); color:var(--gold); transform:translateY(-1px); }
.actions{ display:flex; gap:10px; flex-wrap:wrap; margin-top:4px; }

/* start screen */
.startpage{
  background:var(--panel); border:1px solid var(--rule); border-radius:16px; padding:26px 22px; margin-top:6px;
  box-shadow:0 4px 16px rgba(58,44,24,.06);
}
h2.title{ font-family:var(--font-display); font-size:1.2rem; margin:0 0 4px; color:var(--chalk); text-wrap:balance;}
.sub{ font-family:var(--font-mono); font-size:.68rem; color:var(--dim); letter-spacing:.08em; text-transform:uppercase; margin-bottom:14px;}
p{ line-height:1.75; margin:0 0 14px; font-size:1rem; }
label.field{ display:block; margin-bottom:14px; }
label.field .lbl{ font-family:var(--font-mono); font-size:.68rem; letter-spacing:.08em; text-transform:uppercase; color:var(--dim); display:block; margin-bottom:6px;}
input[type=text]{
  width:100%; font-family:var(--font-body); font-size:1rem; padding:10px 12px;
  background:var(--bg); border:1px solid var(--rule); color:var(--chalk); border-radius:4px;
}
input[type=text]:focus-visible{ outline:2px solid var(--gold); outline-offset:1px; }

.paths{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin:14px 0; }
.pathcard{
  border:2px solid var(--rule); border-radius:12px; padding:14px; cursor:pointer; background:var(--panel2);
  transition:border-color .18s, background .18s, transform .2s cubic-bezier(.34,1.56,.64,1), box-shadow .2s ease;
  box-shadow:0 2px 8px rgba(58,44,24,.04);
}
.pathcard:hover{ border-color:var(--accent, var(--gold)); transform:translateY(-3px) rotate(-0.6deg); box-shadow:0 8px 18px rgba(58,44,24,.1); }
.pathcard.sel{ border-color:var(--accent, var(--red)); background:var(--accent-tint, rgba(255,106,77,0.12)); transform:translateY(-2px); }
.pathcard h3{ font-family:var(--font-display); margin:0 0 4px; font-size:1rem; color:var(--chalk);}
.pathcard p{ margin:0; font-size:.78rem; color:var(--dim); line-height:1.5; }
.pathcard .stats{ font-family:var(--font-mono); font-size:.64rem; color:var(--accent, var(--gold)); margin-top:8px; letter-spacing:.02em;}

.radiorow{ display:flex; gap:8px; flex-wrap:wrap; }
.radiorow label{
  font-family:var(--font-mono); font-size:.7rem; border:1px solid var(--rule); border-radius:4px;
  padding:7px 12px; cursor:pointer; color:var(--dim);
}
.radiorow input{ display:none; }
.radiorow label:has(input:checked){ border-color:var(--red); color:var(--red); background:rgba(255,106,77,.1); }

/* allocator (lives in footer) */
.alloc-row{ display:flex; align-items:center; gap:10px; padding:6px 0; }
.alloc-name{ width:78px; font-family:var(--font-mono); font-size:.74rem; color:var(--dim); flex-shrink:0;}
.alloc-bar{ flex:1; height:7px; background:var(--rule); border-radius:2px; overflow:hidden; }
.alloc-bar i{ display:block; height:100%; background:var(--gold); }
.alloc-btns{ display:flex; gap:4px; }
.alloc-btns button{
  width:24px; height:24px; border:1px solid var(--rule); background:var(--panel2); color:var(--chalk);
  border-radius:3px; font-family:var(--font-mono); cursor:pointer; font-size:.8rem; line-height:1;
}
.alloc-btns button:disabled{ opacity:.3; cursor:not-allowed; }
.pool{ font-family:var(--font-mono); font-size:.76rem; color:var(--gold); text-align:right; margin:0 0 8px; letter-spacing:.05em;}

/* ending */
.ending-tag{
  display:inline-block; font-family:var(--font-mono); font-size:.66rem; letter-spacing:.1em;
  text-transform:uppercase; padding:3px 10px; border:1px solid; margin-bottom:10px; border-radius:3px;
}
.ending-tag.great{ color:var(--gold); border-color:var(--gold); }
.ending-tag.good{ color:var(--good); border-color:var(--good); }
.ending-tag.neutral{ color:var(--dim); border-color:var(--rule); }
.ending-tag.bad{ color:var(--bad); border-color:var(--bad); }
.history{ font-family:var(--font-mono); font-size:.7rem; color:var(--dim); line-height:1.9; }
.careertags{ display:flex; flex-wrap:wrap; gap:8px; margin:4px 0 20px; }
.careertags span{
  font-family:var(--font-mono); font-size:.72rem; letter-spacing:.03em;
  background:var(--panel2); border:1px solid var(--gold); color:var(--gold);
  padding:5px 12px; border-radius:20px;
}
.footer-note{ text-align:center; font-family:var(--font-mono); font-size:.66rem; color:var(--dim); margin-top:20px; letter-spacing:.04em;}
</style>

<script>
(function(){
"use strict";

/* ---------- rng ---------- */
function mulberry32(a){
  return function(){
    a|=0; a=a+0x6D2B79F5|0;
    var t=Math.imul(a^a>>>15,1|a);

  }
  return function(){
    h=Math.imul(h^h>>>16,2246822519);
    h=Math.imul(h^h>>>13,3266489917);

  }();

/* ---------- effect helpers ---------- */
function fmtDelta(p, delta){
  var out=[];
  var L = PATHS[p.path].labels;
  ["a","b","c","d","e"].forEach(function(k){
    if(delta[k]) out.push({label:L[k], val:delta[k]});
  });
  if(delta.money) out.push({label:"財力", val:delta.money, unit:"萬"});
  if(delta.fame) out.push({label:"知名度", val:delta.fame});
  return out;
}
function applyDelta(p, delta){
  ["a","b","c","d","e"].forEach(function(k){
    if(!delta[k]) return;
    var lo = (k==="d" && p.traits && p.traits.battleScarred) ? 15 : 0;
    p.stats[k]=clamp(p.stats[k]+delta[k], lo, 100);
  });
  if(delta.money){
    var m = delta.money;
    if(m<0 && p.traits && p.traits.pennyPincher) m = Math.round(m*0.8);
    p.money += m;
  }
  if(delta.fame) p.fame = clamp(p.fame+(delta.fame||0),0,100);
}

function logCountRef(title){ return S.log.filter(function(l){ return l.title===title; }).length; }

}

}

var EVENTS_BY_ID = {};
EVENTS.forEach(function(ev){ EVENTS_BY_ID[ev.id]=ev; });
function getPendingEvent(){ return EVENTS_BY_ID[S.pendingEventId]; }

/* ---------- game state ---------- */
var S = null;
var seedInput = "";
var startPath = null;
var SAVE_KEY = "pls_save_v1";

function saveProgress(){
  try{ localStorage.setItem(SAVE_KEY, JSON.stringify(S)); }catch(e){}
}
function loadProgress(){
  try{
    var raw = localStorage.getItem(SAVE_KEY);
    if(!raw) return null;
    return JSON.parse(raw);
  }catch(e){ return null; }
}
function clearProgress(){
  try{ localStorage.removeItem(SAVE_KEY); }catch(e){}
}
function resumeProgress(){
  var saved = loadProgress();
  if(!saved) return;
  S = saved;
  var calls = S.rngCalls||0;
  setSeed(S.seed);
  S.rngCalls = 0;
  for(var i=0;i<calls;i++) rng(); // 快轉 rng 到存檔當下的狀態，維持「同種子＋同選擇＝同人生」在重整頁面後依然成立
  render();
}

function newGame(name, pathKey, background){
  var base = PATHS[pathKey].start;
  var bg = BACKGROUNDS[background] || BACKGROUNDS.normal;
  S = {
    name:name||"無名氏",
    path:pathKey,
    background:background,
    stats:{a:base.a, b:base.b, c:base.c, d:base.d, e:clamp(base.e+bg.e,0,100)},
    money: base.money + bg.money,
    fame: base.fame,
    stageIdx:0,
    turnInStage:0,
    age: STAGES[0].ageStart,
    seed: seedInput || makeSeed(),
    entries:[],
    log:[],
    flags:{},
    usedEvents:{},
    eventsThisYear:0,
    phase:"alloc",
    pendingEventId:null,
    forcedEnding:null,
    lowGritStreak:0,
    styleCount:{bold:0, safe:0},
    traits:{},
    gambleWinStreak:0,
    allocFocusKey:null,
    allocFocusStreak:0,
    hadNegativeMoneyEarly:false,
    rngCalls:0
  };
  setSeed(S.seed);
  startYear();
}

/* ---------- turn engine: 1 year = alloc once + 2 events (年初/年中/年末) ---------- */
function poolForYear(){
  var stageNo = S.stageIdx+1;
  return 6 + Math.floor(rng()*3) + (stageNo>=3?1:0) + (S.traits.specialist?1:0); // 6-8(+1 late)(+1 specialist)
}

function startYear(){
  S.phase="alloc";
  S.eventsThisYear=0;
  S.allocPool = poolForYear();
  S.allocSpent = {a:0,b:0,c:0,d:0,e:0};
  if(S.stageIdx>0 || S.turnInStage>0){
    var beforeD = S.stats.d;
    S.stats.d = clamp(S.stats.d+3, 0, 100);
    if(S.stats.d>beforeD){
      S.entries.push('<div class="ticker"><b>年初</b><span>年假總算喘了口氣，抗壓性緩緩回升了一些。</span></div>');
    }
  }
  if(S.money < -20){
    var interest = Math.max(2, Math.round(Math.abs(S.money)*0.05));
    S.money -= interest;
    S.flags.hadDebtInterest = true;
    S.entries.push('<div class="ticker"><b>債務</b><span>信用卡循環利息又扣了 '+interest+' 萬，帳戶餘額持續探底。</span></div>');
  }
  if(checkDebtCrisis()) return;
  render();
}

function confirmAllocation(){
  checkAllocTraits();
  Object.keys(S.allocSpent).forEach(function(k){
    S.stats[k] = clamp(S.stats[k]+S.allocSpent[k],0,100);
  });
  drawEvent();
}

function eligibleEvents(){
  var stageNo = S.stageIdx+1;
  return EVENTS.filter(function(ev){
    if(ev.once && S.usedEvents[ev.id]) return false;
    if(ev.paths.indexOf("all")===-1 && ev.paths.indexOf(S.path)===-1) return false;
    if(stageNo<ev.stageMin || stageNo>ev.stageMax) return false;
    if(ev.requires && !ev.requires(S)) return false;
    return true;
  });
}

function drawEvent(){
  var pool = eligibleEvents();
  if(pool.length===0){ continueAfterEvent(); return; }
  var totalW = pool.reduce(function(s,e){return s+e.weight;},0);
  var r = rng()*totalW;
  var chosen = pool[pool.length-1];
  for(var i=0;i<pool.length;i++){ r-=pool[i].weight; if(r<=0){ chosen=pool[i]; break; } }
  S.usedEvents[chosen.id]=true;
  S.pendingEventId = chosen.id;
  S.phase="event";
  if(rng()<0.4){
    S.entries.push('<div class="ticker"><b>快訊</b><span>'+esc(pick(TICKERS))+'</span></div>');
  }
  render(true);
}

function verdictFor(delta){
  var score = 0;
  ["a","b","c","d","e"].forEach(function(k){ if(delta[k]) score += delta[k]; });
  if(delta.money) score += delta.money/2;
  if(delta.fame) score += delta.fame*1.3;
  if(score>=9) return {cls:"up", tier:"up2"};
  if(score>=3) return {cls:"up", tier:"up1"};
  if(score>-3) return {cls:"flat", tier:"flat"};
  if(score>-9) return {cls:"down", tier:"down1"};
  return {cls:"down", tier:"down2"};
}
function genericResult(tier){ return pick(GENERIC_RESULT[tier]); }

function resolveChoice(idx){
  var ev = getPendingEvent();
  var choice = ev.choices[idx];
  var branch = choice;
  var gambleTag = "";
  if(choice.success && choice.fail){
    var chance = typeof choice.chance==="function" ? choice.chance(S) : (choice.chance===undefined?0.5:choice.chance);
    chance = gambleChance(chance);
    var won = rng() < chance;
    branch = won ? choice.success : choice.fail;
    gambleTag = won
      ? '<span class="gamble-tag win">賭贏了</span>'
      : '<span class="gamble-tag lose">賭輸了</span>';
    checkGambleTraits(won);
  }
  var deltaList = fmtDelta(S, branch.delta);
  var verdict = verdictFor(branch.delta);
  applyDelta(S, branch.delta);
  if(S.stageIdx===0 && S.money<0) S.hadNegativeMoneyEarly = true;
  if(choice.style){ S.styleCount[choice.style] = (S.styleCount[choice.style]||0)+1; }
  if(choice.flag) S.flags[choice.flag] = true;
  if(branch.flag) S.flags[branch.flag] = true;
  var resultText = branch.result || genericResult(verdict.tier);
  var deltaHTML = deltaList.map(function(d){
    var cls = d.val>0?"pos":"neg"; var sign = d.val>0?"+":"";
    return '<span class="'+cls+'">'+esc(d.label)+' '+sign+d.val+(d.unit||"")+'</span>';
  }).join("");
  S.entries.push(
    '<div class="entry"><div class="esub">'+S.age+' 歲 · '+BEAT_LABELS[S.eventsThisYear+1]+'</div>'+
    '<div class="etitle">'+esc(ev.title)+'</div>'+
    '<p>'+esc(ev.desc(S))+'</p>'+
    '<div class="picked">你選擇了：「'+esc(choice.label)+'」'+gambleTag+'</div>'+
    '<div class="result-text"><span class="vdot '+verdict.cls+'"></span><span class="rtxt">'+esc(resultText)+'</span></div>'+
    '<div class="delta">'+(deltaHTML||'<span style="color:var(--dim);background:none;border:none;padding:0;">（沒有明顯變化）</span>')+'</div></div>'
  );
  S.log.push({age:S.age, title:ev.title, choice:choice.label});
  S.pendingEventId = null;
  S.phase="post";
  render(true);
}

function continueAfterEvent(){
  S.eventsThisYear++;
  if(checkDebtCrisis()) return;
  if(S.eventsThisYear<2){ drawEvent(); return; }
  afterYear();
}

function afterYear(){
  if(checkBurnoutCrisis()) return;
  S.turnInStage++;
  S.age++;
  if(S.turnInStage>=STAGES[S.stageIdx].turns){
    var finishedStage = STAGES[S.stageIdx];
    if(finishedStage.key==="rookie" && !S.hadNegativeMoneyEarly) unlockTrait("pennyPincher");
    S.stageIdx++;
    S.turnInStage=0;
    if(S.stageIdx>=STAGES.length){ computeEnding(); return; }
    var nextStage = STAGES[S.stageIdx];
    S.entries.push('<div class="stagebreak">'+finishedStage.label+' 結束　·　邁入 '+nextStage.label+'</div>');
    S.phase="stageend";
    render(true);
    return;
  }
  startYear();
}

function bankruptThreshold(){
  if(S.path==="store") return -(60 + S.stats.e*6);
  return -130;
}

function checkDebtCrisis(){
  if(S.money<=bankruptThreshold()){
    S.forcedEnding = "crushed";
    computeEnding();
    return true;
  }
  return false;
}

function checkBurnoutCrisis(){
  if(S.stats.d<=15){ S.lowGritStreak = (S.lowGritStreak||0)+1; }
  else{ S.lowGritStreak = 0; }
  if(S.lowGritStreak===2){ S.flags.nearBurnout = true; }
  if(S.flags.nearBurnout && S.lowGritStreak<2) unlockTrait("battleScarred");
  if(S.lowGritStreak>=4){
    S.forcedEnding = "burnout";
    computeEnding();
    return true;
  }
  return false;
}

function continueFromStageEnd(){ startYear(); }

/* ---------- allocator UI logic ---------- */
function allocSpentTotal(){
  return Object.keys(S.allocSpent).reduce(function(s,k){return s+S.allocSpent[k];},0);
}
function allocInc(k){
  if(allocSpentTotal()>=S.allocPool) return;
  S.allocSpent[k]++;
  render();
}
function allocDec(k){
  if(S.allocSpent[k]<=0) return;
  S.allocSpent[k]--;
  render();
}

function unlockTrait(key){
  if(S.traits[key]) return;
  S.traits[key] = true;
  var t = TRAIT_DEFS[key];
  S.entries.push(
    '<div class="entry trait"><div class="esub">'+S.age+' 歲 · 特質解鎖</div>'+
    '<div class="etitle">'+icon("star","trait-icon")+esc(t.name)+'</div>'+
    '<p>'+esc(t.desc)+'</p></div>'
  );
}
function gambleChance(base){
  var c = base;
  if(S && S.traits && S.traits.ironNerve) c += 0.08;
  return clamp(c, 0.05, 0.95);
}
function checkGambleTraits(won){
  if(won){
    S.gambleWinStreak = (S.gambleWinStreak||0)+1;
    if(S.gambleWinStreak>=3) unlockTrait("ironNerve");
  } else {
    S.gambleWinStreak = 0;
  }
}
function checkAllocTraits(){
  var total = allocSpentTotal();
  if(total<=0){ S.allocFocusKey=null; S.allocFocusStreak=0; return; }
  var domKey=null, domVal=-1;
  Object.keys(S.allocSpent).forEach(function(k){
    if(S.allocSpent[k]>domVal){ domVal=S.allocSpent[k]; domKey=k; }
  });
  if(domKey===S.allocFocusKey && domVal>=total/2){
    S.allocFocusStreak++;
  } else {
    S.allocFocusKey = (domVal>=total/2) ? domKey : null;
    S.allocFocusStreak = S.allocFocusKey ? 1 : 0;
  }
  if(S.allocFocusStreak>=3) unlockTrait("specialist");
}

function computeTags(){
  var matched = TAGS.filter(function(t){ try{ return t.test(); }catch(e){ return false; } });
  var picked = [];
  var pool = matched.slice();
  while(picked.length<4 && pool.length){
    var i = Math.floor(rng()*pool.length);
    picked.push(pool.splice(i,1)[0].label);
  }
  return picked;
}

  return "";

function computeEnding(){
  var path=S.path;
  var out;
  var isCrisis = false;
  if(S.forcedEnding==="crushed" || S.money<=bankruptThreshold()){
    out = crushedEnding(); isCrisis = true;
  } else if(S.forcedEnding==="burnout"){
    out = burnoutEnding(); isCrisis = true;
  } else if(path==="author"){ out = authorEnding(); }
  else if(path==="editor"){ out = editorEnding(); }
  else if(path==="marketing"){ out = marketingEnding(); }
  else if(path==="translator"){ out = translatorEnding(); }
  else { out = storeEnding(); }
  if(!isCrisis){
    out.text += styleNote();
    if(S.money<-15) out.text += " "+debtNote();
  }
  S.ending = out;
  S.ending.tags = computeTags();
  S.ending.traits = Object.keys(S.traits).filter(function(k){ return S.traits[k]; }).map(function(k){ return TRAIT_DEFS[k]; });
  S.phase="ending";
  render(true);
}

    return {tag:"bad", title:"腰傷退場",

  marketing:{c:"#ff4fa3", t:"rgba(255,79,163,0.14)"},
  translator:{c:"#7c6cf0", t:"rgba(124,108,240,0.14)"},
  store:{c:"#3cb878", t:"rgba(60,184,120,0.14)"}
};
var SLOT_COLOR = { a:"#ff6a4d", b:"#f5a623", c:"#2bb3a3", d:"#3cb878", e:"#7c6cf0", money:"#f5a623", fame:"#ff4fa3" };

/* ---------- render ---------- */
function esc(s){ return String(s).replace(/[&<>]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c];}); }

function statBarsHTML(){
  var order = PATHS[S.path].order, labels=PATHS[S.path].labels;
  var cells = order.map(function(k){
    return '<div class="cell" style="--accent:'+SLOT_COLOR[k]+'"><span class="k">'+icon(SLOT_ICON[k])+labels[k]+'</span><span class="v">'+S.stats[k]+'</span>'+
      '<div class="bar"><i style="width:'+S.stats[k]+'%"></i></div></div>';
  }).join("");
  cells += '<div class="cell money'+(S.money<0?' neg':'')+'" style="--accent:'+SLOT_COLOR.money+'"><span class="k">'+icon("coin")+'財力</span><span class="v">'+S.money+' 萬</span>'+
    '<div class="bar"><i style="width:'+clamp(50+S.money/4,0,100)+'%"></i></div></div>';
  cells += '<div class="cell" style="--accent:'+SLOT_COLOR.fame+'"><span class="k">'+icon("star")+'知名度</span><span class="v">'+S.fame+'</span>'+
    '<div class="bar"><i style="width:'+S.fame+'%"></i></div></div>';
  return '<div class="ledger">'+cells+'</div>';
}

function lampsHTML(){
  return '<div class="lamps">'+BEAT_LABELS.map(function(label,i){
    var cls = "lamp";
    if(i<S.eventsThisYear || (i===0 && S.phase!=="alloc")) cls+=" done";
    if((i===0 && S.phase==="alloc") || (i===S.eventsThisYear+1 && (S.phase==="event"||S.phase==="post"))) cls+=" now";
    return '<span class="'+cls+'">'+label+'</span>';
  }).join("")+'</div>';
}

function headerHTML(){
  var stage = STAGES[S.stageIdx];
  return '<div class="hdr">'+
    '<div class="topline"><span class="stage-pill">'+stage.label+' · 第 '+(S.turnInStage+1)+'/'+stage.turns+' 年</span>'+
    '<span>'+S.age+' 歲 · '+PATHS[S.path].noun+' '+esc(S.name)+' · 種子 '+esc(S.seed)+'</span></div>'+
    lampsHTML()+statBarsHTML()+
    '</div>';
}

function render(scrollDown){
  var app = document.getElementById("app");
  if(!S){ app.innerHTML = renderStart(); bindStart(); return; }
  if(S.phase==="ending"){ clearProgress(); app.innerHTML = renderEnding(); bindEnding(); return; }
  saveProgress();

  var pendingLog = "";
  var footer = "";
  if(S.phase==="alloc"){
    footer = renderAllocFooter();
  } else if(S.phase==="event"){
    var ev = getPendingEvent();
    pendingLog = '<div class="entry pending"><div class="esub">'+S.age+' 歲 · '+BEAT_LABELS[S.eventsThisYear+1]+'</div>'+
      '<div class="etitle">'+esc(ev.title)+'</div><p>'+esc(ev.desc(S))+'</p></div>';
    footer = '<div class="choices">'+ev.choices.map(function(c,i){
      var oddsHTML = "";
      if(c.success && c.fail){
        var baseChance = typeof c.chance==="function" ? c.chance(S) : (c.chance===undefined?0.5:c.chance);
        var pct = Math.round(gambleChance(baseChance)*100);
        oddsHTML = '<span class="odds">放手一搏 · 成功機率 '+pct+'%</span>';
      }
      return '<button class="choice" data-choice="'+i+'">'+esc(c.label)+oddsHTML+'</button>';
    }).join("")+'</div>';
  } else if(S.phase==="post"){
    footer = '<div class="actions"><button class="primary" id="nextBtn">繼續</button></div>';
  } else if(S.phase==="stageend"){
    var nextStage = STAGES[S.stageIdx];
    footer = '<div class="actions"><button class="primary" id="stageContinue">進入'+nextStage.label+'</button></div>';
  }

  app.innerHTML = headerHTML()+
    '<div class="log" id="logArea">'+S.entries.join("")+pendingLog+'</div>'+
    '<div class="ftr" id="ftrArea">'+footer+'</div>';

  bindPhase();
  if(S.phase==="post"){
    var logEl = document.getElementById("logArea");
    var last = logEl && logEl.lastElementChild;
    if(last && last.classList.contains("entry")) last.classList.add("fresh");
  }
  if(scrollDown){
    requestAnimationFrame(function(){ window.scrollTo({top:document.body.scrollHeight, behavior:"auto"}); });
  }
}

function bindPhase(){
  if(S.phase==="alloc"){
    document.querySelectorAll("[data-inc]").forEach(function(b){ b.addEventListener("click", function(){ allocInc(b.getAttribute("data-inc")); }); });
    document.querySelectorAll("[data-dec]").forEach(function(b){ b.addEventListener("click", function(){ allocDec(b.getAttribute("data-dec")); }); });
    var cb = document.getElementById("confirmAlloc");
    if(cb) cb.addEventListener("click", confirmAllocation);
  } else if(S.phase==="event"){
    document.querySelectorAll("[data-choice]").forEach(function(b){
      b.addEventListener("click", function(){ resolveChoice(parseInt(b.getAttribute("data-choice"),10)); });
    });
  } else if(S.phase==="post"){
    var nb = document.getElementById("nextBtn");
    if(nb) nb.addEventListener("click", continueAfterEvent);
  } else if(S.phase==="stageend"){
    var sc = document.getElementById("stageContinue");
    if(sc) sc.addEventListener("click", continueFromStageEnd);
  }
}

/* allocation footer */
function renderAllocFooter(){
  var order = PATHS[S.path].order, labels=PATHS[S.path].labels;
  var spent = allocSpentTotal();
  var rows = order.map(function(k){
    var val = S.stats[k]+S.allocSpent[k];
    return '<div class="alloc-row"><span class="alloc-name">'+labels[k]+'</span>'+
      '<div class="alloc-bar"><i style="width:'+clamp(val,0,100)+'%"></i></div>'+
      '<div class="alloc-btns"><button data-dec="'+k+'" '+(S.allocSpent[k]<=0?"disabled":"")+'>−</button>'+
      '<button data-inc="'+k+'" '+(spent>=S.allocPool?"disabled":"")+'>＋</button></div></div>';
  }).join("");
  return '<p class="hint">年初：這一年能投入的心力有限，分配給誰，決定接下來會遇上什麼。</p>'+
    '<div class="pool">可分配點數：'+(S.allocPool-spent)+' / '+S.allocPool+'</div>'+
    rows+
    '<div class="actions"><button class="primary" id="confirmAlloc">確定分配，迎接這一年</button></div>';
}

/* start screen */
var showSeedField = false;
function renderStart(){
  var cards = Object.keys(PATHS).map(function(k){
    var p = PATHS[k];
    var statNames = p.order.map(function(o){return p.labels[o];}).join(" ／ ");
    var col = PATH_COLOR[k];
    return '<div class="pathcard" data-path="'+k+'" style="--accent:'+col.c+';--accent-tint:'+col.t+'"><div class="picon-wrap">'+icon(PATH_ICON[k],"picon")+'</div><h3>'+p.label+'</h3><p>'+p.blurb+'</p><div class="stats">'+statNames+'</div></div>';
  }).join("");
  var saved = loadProgress();
  var resumeBlock = "";
  if(saved){
    var st = STAGES[saved.stageIdx];
    resumeBlock = '<div class="startpage" style="margin-bottom:14px;">'+
      '<div class="sub">上次玩到一半</div>'+
      '<p style="margin-bottom:10px;">'+PATHS[saved.path].noun+' '+esc(saved.name)+'　·　'+saved.age+' 歲　·　'+st.label+'</p>'+
      '<div class="actions"><button class="primary" id="resumeBtn">繼續上次的旅程</button>'+
      '<button class="ghost" id="discardSaveBtn">捨棄，重新開始</button></div></div>';
  }
  var seedBlock = showSeedField
    ? '<label class="field"><span class="lbl">世界種子（同種子＋同選擇＝同人生）</span>'+
      '<div style="display:flex; gap:8px;"><input type="text" id="seedInput" placeholder="留空則隨機" style="flex:1;">'+
      '<button class="ghost" id="rerollSeed" type="button">換一個</button></div></label>'
    : '<button class="ghost" id="seedToggle" type="button" style="margin-bottom:14px;">進階：自訂世界種子</button>';
  return resumeBlock+'<div class="startpage">'+
    '<h2 class="title">角色設定</h2>'+
    '<div class="sub">Character Sheet</div>'+
    '<label class="field"><span class="lbl">筆名 / 姓名</span><input type="text" id="nameInput" placeholder="例如：林小記" maxlength="12"></label>'+
    '<label class="field"><span class="lbl">選擇路線</span></label>'+
    '<div class="paths" id="pathPicker">'+cards+'</div>'+
    '<div id="bgWrap"></div>'+
    seedBlock+
    '<div class="actions"><button class="primary" id="startBtn">開始職涯 ▸ 新人期</button></div>'+
    '</div>';
}
function bgPickerHTML(){
  if(startPath!=="store") return "";
  var opts = Object.keys(BACKGROUNDS).map(function(k){
    return '<label><input type="radio" name="bg" value="'+k+'" '+(k==="normal"?"checked":"")+'><span>'+BACKGROUNDS[k].label+'</span></label>';
  }).join("");
  return '<label class="field"><span class="lbl">家境（影響起始資金與資金上限）</span><div class="radiorow">'+opts+'</div></label>';
}
function bindStart(){
  var resumeBtn = document.getElementById("resumeBtn");
  if(resumeBtn) resumeBtn.addEventListener("click", resumeProgress);
  var discardBtn = document.getElementById("discardSaveBtn");
  if(discardBtn) discardBtn.addEventListener("click", function(){ clearProgress(); render(); });

  var picker = document.getElementById("pathPicker");
  picker.addEventListener("click", function(e){
    var card = e.target.closest(".pathcard");
    if(!card) return;
    startPath = card.getAttribute("data-path");
    Array.prototype.forEach.call(picker.children, function(c){ c.classList.toggle("sel", c===card); });
    document.getElementById("bgWrap").innerHTML = bgPickerHTML();
  });
  var seedToggle = document.getElementById("seedToggle");
  if(seedToggle) seedToggle.addEventListener("click", function(){ showSeedField = true; render(); });
  var rerollBtn = document.getElementById("rerollSeed");
  if(rerollBtn) rerollBtn.addEventListener("click", function(){
    document.getElementById("seedInput").value = makeSeed();
  });
  document.getElementById("startBtn").addEventListener("click", function(){
    var name = document.getElementById("nameInput").value.trim();
    if(!startPath){ alert("請先選擇一條路線。"); return; }
    var seedEl = document.getElementById("seedInput");
    seedInput = seedEl ? seedEl.value.trim() : "";
    var bgEl = document.querySelector('input[name="bg"]:checked');
    newGame(name, startPath, bgEl?bgEl.value:"normal");
  });
}

/* ending */
function renderEnding(){
  var e = S.ending;
  var historyLines = S.log.map(function(l){ return l.age+' 歲　'+esc(l.title)+'　→　'+esc(l.choice); }).join("<br>");
  return '<div class="startpage">'+
    '<div class="ending-icon-wrap">'+icon("trophy","ending-icon")+'</div>'+
    '<span class="ending-tag '+e.tag+'">Ending</span>'+
    '<h2 class="title">'+esc(e.title)+'</h2>'+
    '<div class="sub">'+PATHS[S.path].noun+' '+esc(S.name)+' · 終章 '+S.age+' 歲 · 種子 '+esc(S.seed)+'</div>'+
    '<p>'+esc(e.text)+'</p>'+
    (e.tags&&e.tags.length ? '<div class="careertags">'+e.tags.map(function(t){return '<span>'+esc(t)+'</span>';}).join("")+'</div>' : "")+
    (e.traits&&e.traits.length ? '<div class="sub" style="margin-top:6px;">解鎖特質</div><div class="traitlist">'+
      e.traits.map(function(t){ return '<div class="tcard"><div class="tname">'+icon("star")+esc(t.name)+'</div><div class="tdesc">'+esc(t.desc)+'</div></div>'; }).join("")+
      '</div>' : "")+
    statBarsHTML()+
    '<div class="sub" style="margin-top:14px;">生涯記事</div>'+
    '<div class="history">'+(historyLines||"（平淡的一生，沒留下什麼紀錄）")+'</div>'+
    '<div class="actions"><button class="primary" id="downloadCardBtn">下載結果卡（圖片）</button>'+
    '<button class="ghost" id="restartBtn">重新開始人生</button>'+
    '<button class="ghost" id="sameSeedBtn">用同一顆種子再來一次</button></div>'+
    '</div>';
}
function bindEnding(){
  document.getElementById("downloadCardBtn").addEventListener("click", downloadResultCard);
  document.getElementById("restartBtn").addEventListener("click", function(){ S=null; seedInput=""; startPath=null; render(); window.scrollTo(0,0); });
  document.getElementById("sameSeedBtn").addEventListener("click", function(){
    var seed=S.seed, path=S.path, name=S.name, bg=S.background;
    seedInput = seed;
    newGame(name, path, bg);
    window.scrollTo(0,0);
  });
}

/* ---------- shareable result card ---------- */
var TAG_COLOR = { great:"#d3a24d", good:"#8fbf8a", neutral:"#a89d86", bad:"#d9705a" };
var TAG_TEXT = { great:"GREAT ENDING", good:"GOOD ENDING", neutral:"NEUTRAL ENDING", bad:"BAD ENDING" };

function wrapText(ctx, text, x, y, maxWidth, lineHeight){
  var chars = String(text).split("");
  var line = "";
  var lines = [];
  for(var i=0;i<chars.length;i++){
    var test = line+chars[i];
    if(ctx.measureText(test).width>maxWidth && line!==""){ lines.push(line); line=chars[i]; }
    else{ line=test; }
  }
  if(line) lines.push(line);
  lines.forEach(function(l,idx){ ctx.fillText(l, x, y+idx*lineHeight); });
  return lines.length*lineHeight;
}

function makeResultCardDataURL(){
  var e = S.ending;
  var W=800, H=1000;
  var cv = document.createElement("canvas");
  cv.width=W; cv.height=H;
  var ctx = cv.getContext("2d");

  ctx.fillStyle = "#14120f";
  ctx.fillRect(0,0,W,H);
  ctx.strokeStyle = "#3a3226";
  ctx.lineWidth = 2;
  ctx.strokeRect(24,24,W-48,H-48);

  ctx.fillStyle = "#a89d86";
  ctx.font = "13px monospace";
  ctx.fillText("PUBLISHING LIFE SIMULATOR", 56, 76);

  ctx.fillStyle = TAG_COLOR[e.tag]||"#a89d86";
  ctx.font = "bold 13px monospace";
  ctx.fillText(TAG_TEXT[e.tag]||"ENDING", 56, 102);
  ctx.strokeStyle = TAG_COLOR[e.tag]||"#a89d86";
  ctx.strokeRect(50,86,ctx.measureText(TAG_TEXT[e.tag]||"ENDING").width+14,24);

  ctx.fillStyle = "#ece4d2";
  ctx.font = "bold 40px serif";
  var titleH = wrapText(ctx, e.title, 56, 168, W-112, 48);

  var subY = 168+titleH+18;
  ctx.fillStyle = "#a89d86";
  ctx.font = "16px serif";
  ctx.fillText(PATHS[S.path].noun+" "+S.name+"　·　"+S.age+" 歲", 56, subY);

  ctx.strokeStyle = "#3a3226";
  ctx.beginPath(); ctx.moveTo(56, subY+24); ctx.lineTo(W-56, subY+24); ctx.stroke();

  ctx.fillStyle = "#ece4d2";
  ctx.font = "17px serif";
  var bodyY = subY+66;
  bodyY += wrapText(ctx, e.text, 56, bodyY, W-112, 30);

  var order = PATHS[S.path].order, labels = PATHS[S.path].labels;
  var statsY = Math.max(bodyY+50, H-360);
  ctx.fillStyle = "#d3a24d";
  ctx.font = "12px monospace";
  ctx.fillText("FINAL STATUS", 56, statsY);
  statsY += 26;
  var colW = (W-112)/2;
  var allStats = order.map(function(k){ return {label:labels[k], val:S.stats[k], max:100}; });
  allStats.push({label:"財力", val:S.money, unit:" 萬"});
  allStats.push({label:"知名度", val:S.fame, max:100});
  allStats.forEach(function(st,i){
    var col = i%2, row = Math.floor(i/2);
    var x = 56+col*colW, y = statsY+row*54;
    ctx.fillStyle = "#a89d86";
    ctx.font = "12px monospace";
    ctx.fillText(st.label, x, y);
    ctx.fillStyle = "#ece4d2";
    ctx.font = "bold 20px monospace";
    ctx.fillText(String(st.val)+(st.unit||""), x, y+24);
    if(st.max){
      ctx.strokeStyle="#3a3226"; ctx.fillStyle="#3a3226";
      ctx.fillRect(x, y+30, colW-20, 4);
      ctx.fillStyle = "#c1503a";
      ctx.fillRect(x, y+30, Math.max(0,Math.min(1,st.val/st.max))*(colW-20), 4);
    }
  });

  if(e.tags && e.tags.length){
    var tagY = H-78;
    ctx.font = "13px monospace";
    var tx = 56;
    e.tags.forEach(function(tag){
      var w = ctx.measureText(tag).width+18;
      if(tx+w>W-56){ tx=56; tagY+=26; }
      ctx.strokeStyle = "#d3a24d";
      ctx.strokeRect(tx, tagY-16, w, 22);
      ctx.fillStyle = "#d3a24d";
      ctx.fillText(tag, tx+9, tagY);
      tx += w+8;
    });
  }

  ctx.fillStyle = "#a89d86";
  ctx.font = "11px monospace";
  ctx.fillText("種子 "+S.seed+"　·　publishing-life-simulator", 56, H-40);

  return cv.toDataURL("image/png");
}

function downloadResultCard(){
  var url = makeResultCardDataURL();
  var a = document.createElement("a");
  a.href = url;
  a.download = "出版人生-"+S.name+"-"+S.ending.title+".png";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

render();
})();
</script>
